<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UNO 联机版 · MQTT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--red:#e63946;--yellow:#e8a900;--green:#2a9d54;--blue:#2b7fd4;--card-w:66px;--card-h:99px}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 50% 38%,#1c7a4c 0%,#0a3a22 68%,#041d0d 100%);color:#fff;overflow:hidden;user-select:none}
#app{height:100dvh;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none !important}
.btn-primary{background:#ffd84d;color:#1a1a1a;border:none;border-radius:24px;padding:12px 28px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #b99a1e;transition:.15s;font-family:inherit}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b99a1e}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 4px 0 #5a4c14}
.btn-secondary{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:24px;padding:11px 24px;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit}
.btn-secondary:active{transform:scale(.96)}
.btn-ghost{background:transparent;color:rgba(255,255,255,.75);border:1.5px solid rgba(255,255,255,.28);border-radius:20px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
.btn-ghost:active{transform:scale(.96)}
#screenHome{align-items:center;justify-content:center;padding:24px}
.home-card{width:100%;max-width:360px;background:linear-gradient(160deg,rgba(30,42,36,.92),rgba(13,26,19,.95));border:2px solid rgba(255,216,77,.28);border-radius:24px;padding:34px 28px 28px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px}
.brand-big{font-size:52px;font-weight:900;font-style:italic;letter-spacing:2px;text-align:center;color:#ffd84d;line-height:1;text-shadow:3px 3px 0 #b3202c,6px 6px 16px rgba(0,0,0,.6)}
.home-sub{text-align:center;font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.5);font-weight:700;margin-bottom:8px}
.home-card input{width:100%;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.16);border-radius:14px;padding:13px 16px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.2s}
.home-card input:focus{border-color:rgba(255,216,77,.65);background:rgba(0,0,0,.5)}
.home-card input::placeholder{color:rgba(255,255,255,.32)}
.home-row{display:flex;gap:10px}
.home-row .btn-primary,.home-row .btn-secondary{flex:1}
.home-row input{flex:1.2;text-transform:uppercase;letter-spacing:2px;font-weight:800}
.home-divider{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.28);font-size:11px;font-weight:700}
.home-divider::before,.home-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.14)}
.home-tip{min-height:18px;text-align:center;font-size:12px;color:#ff9a9a;font-weight:600}
.home-tip-line{text-align:center;font-size:11px;color:rgba(255,255,255,.42);font-weight:600;line-height:1.5}
#screenLobby{align-items:center;justify-content:center;padding:24px}
.lobby-card{width:100%;max-width:400px;background:linear-gradient(160deg,rgba(30,42,36,.92),rgba(13,26,19,.95));border:2px solid rgba(255,216,77,.28);border-radius:24px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.lobby-title{font-size:15px;font-weight:700;color:rgba(255,255,255,.65);text-align:center;margin-bottom:6px}
.lobby-title span{display:inline-block;font-size:26px;font-weight:900;letter-spacing:5px;color:#ffd84d;vertical-align:middle;margin-left:6px;text-shadow:0 2px 8px rgba(255,216,77,.4)}
.lobby-hint{text-align:center;font-size:12px;color:rgba(255,255,255,.42);margin-bottom:16px;font-weight:600}
.lobby-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lobby-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:700;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}}
.lobby-item .avatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:900;background:linear-gradient(135deg,#ffd84d,#e8a900);color:#1a1a1a}
.lobby-item.is-bot .avatar{background:linear-gradient(135deg,#7a8fa6,#4a5b6e);color:#fff}
.lobby-item .tag{margin-left:auto;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:rgba(255,216,77,.18);color:#ffd84d}
.lobby-item .tag.host{background:rgba(255,92,92,.18);color:#ff8a8a}
.lobby-mode{display:flex;align-items:center;gap:10px;background:rgba(255,92,92,.1);border:1.5px solid rgba(255,92,92,.28);border-radius:14px;padding:11px 14px;margin-bottom:16px;cursor:pointer;transition:.18s}
.lobby-mode:hover{background:rgba(255,92,92,.16)}
.lobby-mode input[type=checkbox]{width:20px;height:20px;accent-color:#ff5c5c;cursor:pointer;flex:none;margin:0}
.lobby-mode input[type=checkbox]:disabled{cursor:not-allowed;opacity:.6}
.lobby-mode .lm-text{flex:1;font-size:12px;font-weight:700;line-height:1.4;color:rgba(255,255,255,.85)}
.lobby-mode .lm-text b{color:#ff8a8a}
.lobby-mode .lm-text small{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,.42);margin-top:2px}
.lobby-actions{display:flex;flex-direction:column;gap:10px}
.lobby-actions .btn-primary{width:100%}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex:none;gap:6px}
.brand{font-size:22px;font-weight:900;font-style:italic;letter-spacing:1px;color:#ffd84d;text-shadow:2px 2px 0 #b3202c,3px 3px 8px rgba(0,0,0,.5);flex:none}
#roomBadge{font-size:10px;font-weight:800;letter-spacing:1.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);padding:4px 10px;border-radius:12px;color:rgba(255,255,255,.7);flex:none}
#mercyBadge{font-size:9px;font-weight:900;letter-spacing:1px;background:rgba(255,92,92,.22);border:1px solid rgba(255,92,92,.5);padding:4px 9px;border-radius:12px;color:#ff8a8a;flex:none}
#micBadge{font-size:9px;font-weight:900;letter-spacing:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:4px 9px;border-radius:12px;color:rgba(255,255,255,.55);flex:none;transition:.3s}
#micBadge.ready{background:rgba(142,230,168,.15);border-color:rgba(142,230,168,.45);color:#8ee6a8}
#status{font-size:12px;font-weight:600;opacity:.9;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turnTimer{font-size:11px;font-weight:800;padding:4px 9px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);letter-spacing:.5px;flex:none;min-width:46px;text-align:center;transition:.2s;font-variant-numeric:tabular-nums}
#turnTimer.urgent{background:rgba(255,92,92,.28);border-color:rgba(255,92,92,.7);color:#ff8a8a;animation:timerPulse .7s infinite}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 0 14px rgba(255,92,92,.6)}}
#passBtn{background:#ffd84d;color:#1a1a1a;border:none;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #b99a1e;transition:.15s;flex:none;font-family:inherit}
#passBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b99a1e}
#soundToggle{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:14px;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:none;padding:0;line-height:1}
#soundToggle.muted{opacity:.4}
#soundToggle:active{transform:scale(.92)}
#opponents{display:flex;justify-content:center;gap:10px;padding:2px 10px 0;flex:none;flex-wrap:wrap}
.opponent{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.08);border-radius:14px;padding:7px 11px;min-width:98px;text-align:center;transition:.35s;position:relative}
.opponent.active{border-color:#ffd84d;background:rgba(255,216,77,.16);transform:translateY(-2px);animation:activeGlow 2s ease-in-out infinite}
@keyframes activeGlow{0%,100%{box-shadow:0 0 18px rgba(255,216,77,.35)}50%{box-shadow:0 0 30px rgba(255,216,77,.75)}}
.opponent.out{opacity:.35;filter:grayscale(.9);border-color:rgba(255,92,92,.3)}
.opponent.penalty{animation:oppPenalty .5s ease}
.opponent.uno-shout{animation:unoShoutFlash .8s ease}
@keyframes unoShoutFlash{0%,100%{box-shadow:0 0 18px rgba(255,216,77,.35)}30%{box-shadow:0 0 40px rgba(255,92,92,.9);border-color:#ff5c5c}60%{box-shadow:0 0 30px rgba(255,216,77,.7);border-color:#ffd84d}}
@keyframes oppPenalty{0%,100%{transform:scale(1) translateX(0)}20%{transform:scale(1.06) translateX(-3px)}40%{transform:scale(.98) translateX(3px)}60%{transform:scale(1.04) translateX(-2px)}80%{transform:scale(.99) translateX(2px)}}
.opp-name{font-size:11px;font-weight:700;margin-bottom:5px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.opp-cards{display:flex;justify-content:center;height:20px}
.mini-back{width:14px;height:20px;border-radius:3px;background:#141414;border:1px solid rgba(255,255,255,.85);flex:none}
.opp-cards .mini-back + .mini-back{margin-left:-8px}
.opp-count{font-size:10px;margin-top:5px;opacity:.75;font-weight:600}
.opp-count.uno{color:#ff5c5c;font-weight:900;animation:pulse 1s infinite}
.opp-count.out{color:#ff8a8a;font-weight:800;letter-spacing:.5px}
.opp-count.warn{color:#ffb06a;font-weight:800}
@keyframes pulse{50%{opacity:.45}}
#table{flex:1;display:flex;align-items:center;justify-content:center;gap:52px;min-height:0;padding:8px}
.pile-slot{display:flex;flex-direction:column;align-items:center;gap:9px}
.pile{position:relative;width:var(--card-w);height:var(--card-h)}
.pile .card{position:absolute;inset:0}
#drawPile{cursor:pointer}
#drawPile:active{transform:scale(.96)}
.pile-label{font-size:11px;font-weight:700;opacity:.7;letter-spacing:.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--red);box-shadow:0 0 8px currentColor;transition:.25s}
.card{width:var(--card-w);height:var(--card-h);border-radius:9px;background:#fff;padding:3px;position:relative;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.card .face{width:100%;height:100%;border-radius:7px;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--c)}
.card .oval{position:absolute;width:165%;height:64%;background:#fff;border-radius:50%;transform:rotate(-33deg);z-index:1}
.card .label{position:relative;z-index:5;line-height:1;font-size:calc(var(--card-h) * .3);font-weight:900;font-style:italic;color:var(--c);letter-spacing:-1px;pointer-events:none}
.card .label.small{font-size:calc(var(--card-h) * .21) !important;letter-spacing:-1.2px}
.face.red{--c:var(--red)}.face.yellow{--c:var(--yellow)}.face.green{--c:var(--green)}.face.blue{--c:var(--blue)}
.face.wild{--c:#fff;background:conic-gradient(from 45deg,var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0)}
.face.wild .label{font-size:calc(var(--card-h) * .26);text-shadow:0 2px 5px rgba(0,0,0,.65);letter-spacing:0}
.card.back .face{--c:#141414;background:#141414}
.card.back .oval{width:150%;height:58%;background:var(--red)}
.card.back .label{color:#fff;font-size:calc(var(--card-h) * .19);font-style:italic;letter-spacing:-.5px;transform:rotate(-33deg);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.card.mercy{box-shadow:0 3px 10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset}
.card.mercy .face{background:#141414;border:2.5px solid var(--c);box-sizing:border-box}
.card.mercy .oval{display:none}
.card.mercy .label{color:var(--c);font-weight:900;z-index:5;text-shadow:0 0 12px var(--c),0 0 4px var(--c),0 0 1px rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.9)}
.card.mercy .face.wild{border:2.5px solid transparent;background-image:linear-gradient(#141414,#141414),conic-gradient(from 45deg,var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0);background-origin:padding-box,border-box;background-clip:padding-box,border-box}
.card.mercy .face.wild .label{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.95),0 0 5px rgba(255,255,255,.7),0 2px 6px rgba(0,0,0,.95)}
.card.mercy .label.small{font-size:calc(var(--card-h) * .22) !important;letter-spacing:-.8px}
.card.just-dropped{animation:cardDrop .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardDrop{0%{transform:scale(1.5) translateY(-40px) rotate(-8deg);opacity:0}60%{transform:scale(.94) translateY(3px) rotate(2deg);opacity:1}100%{transform:scale(1) translateY(0) rotate(0)}}
#handArea{height:172px;flex:none;display:flex;align-items:flex-end;justify-content:flex-start;padding:0 10px 14px;overflow-x:auto;overflow-y:hidden;position:relative}
#hand{display:flex;align-items:flex-end;padding-top:36px;margin:0 auto;flex:0 0 auto}
#hand .card{position:relative;z-index:1;transition:transform .18s ease,box-shadow .18s ease,z-index 0s}
#hand .card:not(.playable):not(.selected){filter:brightness(.55) saturate(.65)}
#hand .card.playable{cursor:pointer;z-index:10;box-shadow:0 0 0 2px rgba(255,216,77,.9),0 4px 12px rgba(0,0,0,.5)}
#hand .card.playable:hover{transform:translateY(calc(var(--card-h) * -0.15)) scale(1.03);z-index:30}
#hand .card.selected{z-index:25;transform:translateY(calc(var(--card-h) * -0.3)) scale(1.08);filter:brightness(1.12) saturate(1.15);box-shadow:0 0 0 3px #ffd84d,0 0 26px rgba(255,216,77,.85),0 10px 26px rgba(0,0,0,.6)}
#hand .card.selected:hover{transform:translateY(calc(var(--card-h) * -0.3)) scale(1.08);z-index:30}
#hand .card.newly-drawn{animation:newCardIn .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes newCardIn{0%{transform:translateY(-60px) scale(1.2);opacity:0;box-shadow:0 0 0 3px #8ee6a8,0 0 30px rgba(142,230,168,.8)}40%{transform:translateY(5px) scale(1.05);opacity:1;box-shadow:0 0 0 3px #8ee6a8,0 0 30px rgba(142,230,168,.8)}100%{transform:translateY(0) scale(1);box-shadow:0 0 0 0 transparent}}
#hand .card.stagger-in{animation:staggerIn .55s cubic-bezier(.2,1.4,.5,1) backwards}
@keyframes staggerIn{0%{transform:translateY(-120px) rotate(-18deg) scale(.35);opacity:0}55%{transform:translateY(8px) rotate(4deg) scale(1.06);opacity:1}100%{transform:translateY(0) rotate(0) scale(1);opacity:1}}
#playBtn{position:absolute;top:8px;right:12px;z-index:60;width:60px;height:60px;border:none;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffe27a,#ffd84d 55%,#e8a900);color:#1a1a1a;font-weight:900;font-size:14px;letter-spacing:1px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #b99a1e,0 6px 18px rgba(0,0,0,.5);transition:transform .12s, box-shadow .12s, opacity .2s}
#playBtn:disabled{opacity:.28;cursor:not-allowed;filter:grayscale(.55);box-shadow:0 4px 0 #5a4c14,0 2px 8px rgba(0,0,0,.5);animation:none}
#playBtn:not(:disabled){animation:playPulse 1.6s infinite}
#playBtn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #b99a1e,0 2px 8px rgba(0,0,0,.5)}
#playBtn:not(:disabled):hover{transform:translateY(-2px) scale(1.04)}
@keyframes playPulse{0%,100%{box-shadow:0 4px 0 #b99a1e,0 6px 18px rgba(0,0,0,.5),0 0 0 0 rgba(255,216,77,.8)}50%{box-shadow:0 4px 0 #b99a1e,0 6px 18px rgba(0,0,0,.5),0 0 0 14px rgba(255,216,77,0)}}
#outHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;pointer-events:none;font-size:18px;font-weight:900;color:#ff8a8a;letter-spacing:3px;text-shadow:0 2px 12px rgba(255,92,92,.6)}
body.shake{animation:screenShake .5s ease}
@keyframes screenShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-6px,-4px)}20%{transform:translate(6px,4px)}30%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}50%{transform:translate(-4px,3px)}60%{transform:translate(4px,-3px)}70%{transform:translate(-3px,2px)}80%{transform:translate(3px,-2px)}90%{transform:translate(-1px,1px)}}
body.shake-red{animation:screenShakeRed .6s ease}
@keyframes screenShakeRed{0%,100%{transform:translate(0,0);filter:none}10%{transform:translate(-8px,-5px);filter:brightness(1.15)}20%{transform:translate(8px,5px);filter:brightness(1.15)}30%{transform:translate(-6px,4px);filter:brightness(1.1) hue-rotate(-15deg)}40%{transform:translate(6px,-4px);filter:brightness(1.1) hue-rotate(-15deg)}60%{transform:translate(-4px,3px)}80%{transform:translate(4px,-3px)}}
.float-text{position:fixed;pointer-events:none;font-weight:900;font-size:34px;z-index:999;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 20px currentColor;transform:translate(-50%,-50%);animation:floatUp 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}30%{transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(.9)}}
#startOverlay{position:fixed;inset:0;z-index:400;background:radial-gradient(ellipse at 50% 45%,rgba(20,60,40,.98),rgba(0,0,0,.98) 75%);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:1;transition:opacity .32s ease}
#startOverlay.out{opacity:0}
#startCountdown{font-size:150px;font-weight:900;font-style:italic;line-height:1;color:#ffd84d;text-shadow:0 8px 40px rgba(255,216,77,.65),0 0 80px rgba(255,216,77,.45),4px 4px 0 #b3202c,8px 8px 24px rgba(0,0,0,.7);letter-spacing:-4px;will-change:transform,opacity}
#startCountdown.go{color:#8ee6a8;text-shadow:0 8px 40px rgba(142,230,168,.85),0 0 90px rgba(142,230,168,.6),4px 4px 0 #1a5e30,8px 8px 24px rgba(0,0,0,.7);font-size:96px;letter-spacing:4px}
#startCountdown.tick{animation:countdownTick .5s cubic-bezier(.2,1.4,.5,1)}
@keyframes countdownTick{0%{transform:scale(.25);opacity:0}45%{transform:scale(1.22);opacity:1}70%{transform:scale(.96)}100%{transform:scale(1);opacity:1}}
#startSub{font-size:12px;letter-spacing:8px;font-weight:800;color:rgba(255,255,255,.42);animation:subFadeIn .6s ease}
@keyframes subFadeIn{from{opacity:0;letter-spacing:16px}to{opacity:1;letter-spacing:8px}}
#screenGame.appear{animation:screenAppear .45s cubic-bezier(.2,.8,.4,1)}
@keyframes screenAppear{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:186px;transform:translate(-50%,12px);background:rgba(0,0,0,.84);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.28s;z-index:200;white-space:nowrap;border:1px solid rgba(255,255,255,.12);max-width:88vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.mercy{background:rgba(120,10,20,.9);border-color:rgba(255,92,92,.4);animation:toastMercy .4s ease}
@keyframes toastMercy{0%{transform:translate(-50%,0) scale(.9)}50%{transform:translate(-50%,0) scale(1.05)}100%{transform:translate(-50%,0) scale(1)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:300;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.panel{background:linear-gradient(160deg,#1e2a24,#0d1a13);border:2px solid rgba(255,216,77,.35);border-radius:20px;padding:30px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:pop .3s cubic-bezier(.2,1.4,.5,1);max-width:88vw}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.panel-title{font-size:20px;font-weight:800;margin-bottom:20px}
.color-options{display:flex;gap:14px;justify-content:center}

<script>
const COLORS=['red','yellow','green','blue'];
const COLOR_NAME={red:'红',yellow:'黄',green:'绿',blue:'蓝'};
const BROKER='wss://broker.emqx.io:8084/mqtt';
const PREFIX='uno/v13/';
const BOT_NAMES=['小蓝','小绿','小黄'];
const MERCY_LIMIT=25;
const MERCY_VALUES=['wild6','wild10','reverse_draw4','skip_everyone','discard_all'];
const TURN_TIME_MS=30000;
const UNO_WINDOW_MS=12000;         /* 12秒窗口 */
const UNO_MIC_CHECK_MS=8000;       /* 识别 8 秒 */
const UNO_MIC_THRESHOLD=85;        /* 音量阈值 */
const UNO_MIC_PEAK_THRESHOLD=140;  /* 峰值阈值 */
const UNO_MIC_MIN_QUIET=6;         /* 静默帧数 */
const UNO_SPEECH_KEYWORDS=/uno|乌诺|优诺|尤诺|优no|尤no|you\s*no|u\s*no|优咯|优若|乌no/i;

const G={
  pid:'p'+Math.random().toString(36).slice(2,9),
  name:'',room:'',isHost:false,pub:null,myHand:[],
  joined:false,screen:'home',selectedId:null,
  localPlayLock:false,
  _lockTimer:null,
  _lastSeenCurrentPid:null,
  _lastSeenTurnSeq:null,
  _unoShouting:false,
  _micStream:null,                /* 缓存的麦克风流 */
  _micPrewarmPromise:null
};
const Host={
  active:false,players:[],deck:[],discard:[],
  currentIdx:0,dir:1,currentColor:null,
  started:false,winner:null,drawnBy:null,
  lobbyPlayers:[],mercyMode:false,lastAction:null,
  turnStartedAt:0,turnTimer:null,
  turnSeq:0,
  pendingUnoPid:null,
  pendingUnoDeadline:0,
  pendingUnoTimer:null,
  pendingAdvanceSkip:null
};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=id=>document.getElementById(id);

/* ============ 麦克风管理 ============ */
async function prewarmMic(){
  if(G._micStream&&G._micStream.active)return G._micStream;
  if(G._micPrewarmPromise)return G._micPrewarmPromise;
  G._micPrewarmPromise=(async()=>{
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        updateMicBadge(false,'不支持');
        return null;
      }
      const s=await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:false,
          noiseSuppression:false,
          autoGainControl:false,
          channelCount:1
        }
      });
      G._micStream=s;
      updateMicBadge(true,'已授权');
      console.log('[mic] 预授权成功');
      return s;
    }catch(e){
      console.warn('[mic] 预授权失败',e);
      G._micStream=null;
      let t='未授权';
      if(e.name==='NotAllowedError')t='被拒绝';
      else if(e.name==='NotFoundError')t='无设备';
      updateMicBadge(false,t);
      return null;
    }finally{
      G._micPrewarmPromise=null;
    }
  })();
  return G._micPrewarmPromise;
}

function releaseMic(){
  if(G._micStream){
    try{G._micStream.getTracks().forEach(t=>t.stop())}catch(e){}
    G._micStream=null;
  }
  updateMicBadge(false,'未授权');
}

function updateMicBadge(ready,text){
  const el=$('micBadge');
  if(!el)return;
  el.textContent='🎤 '+(text||(ready?'已授权':'未授权'));
  el.classList.toggle('ready',!!ready);
}

function setLocalPlayLock(){
  G.localPlayLock=true;
  clearTimeout(G._lockTimer);
  G._lockTimer=setTimeout(()=>{
    G.localPlayLock=false;
    if(G.screen==='game'){renderHand();renderStatus()}
  },4000);
}
function clearLocalPlayLock(){
  if(!G.localPlayLock)return;
  G.localPlayLock=false;
  clearTimeout(G._lockTimer);
  G._lockTimer=null;
}

let audioCtx=null;
let soundEnabled=localStorage.getItem('uno_sound')!=='off';
function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur,opts){
  if(!soundEnabled)return;
  const ctx=initAudio();if(!ctx)return;
  opts=opts||{};
  const t0=ctx.currentTime+(opts.delay||0);
  const osc=ctx.createOscillator();
  const g=ctx.createGain();
  osc.type=opts.type||'sine';
  osc.frequency.setValueAtTime(freq,t0);
  if(opts.to)osc.frequency.exponentialRampToValueAtTime(opts.to,t0+dur);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(opts.vol||0.15,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0);osc.stop(t0+dur+0.02);
}
const SFX={
  play(){tone(700,0.08,{type:'triangle',vol:0.12});tone(950,0.1,{type:'triangle',vol:0.08,delay:0.05})},
  draw(){tone(500,0.1,{type:'sine',vol:0.1,to:380})},
  penalty(){tone(220,0.15,{type:'sawtooth',vol:0.14});tone(160,0.24,{type:'sawtooth',vol:0.12,delay:0.08})},
  uno(){[523,659,784].forEach((f,i)=>tone(f,0.12,{type:'square',vol:0.13,delay:i*0.08}))},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,0.18,{type:'triangle',vol:0.16,delay:i*0.1}))},
  lose(){[440,370,294].forEach((f,i)=>tone(f,0.22,{type:'sine',vol:0.12,delay:i*0.13}))},
  click(){tone(660,0.04,{type:'square',vol:0.06})},
  pop(){tone(880,0.05,{type:'sine',vol:0.08});tone(1200,0.06,{type:'sine',vol:0.06,delay:0.04})},
  tickHi(){tone(1200,0.14,{type:'triangle',vol:0.16})},
  tickLo(){tone(520,0.1,{type:'triangle',vol:0.12})},
  timeout(){tone(400,0.15,{type:'sawtooth',vol:0.14,to:250});tone(300,0.2,{type:'sawtooth',vol:0.12,delay:0.12})},
  skip(){tone(880,0.06,{type:'square',vol:0.1});tone(1200,0.08,{type:'square',vol:0.09,delay:0.05})},
  unoUrgent(){[880,1200,1600].forEach((f,i)=>tone(f,0.08,{type:'square',vol:0.15,delay:i*0.06}))},
  unoShoutOK(){[523,784,1047,1319].forEach((f,i)=>tone(f,0.15,{type:'triangle',vol:0.18,delay:i*0.08}))},
  listening(){tone(440,0.1,{type:'sine',vol:0.1});tone(660,0.15,{type:'sine',vol:0.1,delay:0.12})}
};

function shakeScreen(red){
  const cls=red?'shake-red':'shake';
  document.body.classList.add(cls);
  setTimeout(()=>document.body.classList.remove(cls),red?600:500);
  if(navigator.vibrate){try{navigator.vibrate(red?[60,30,60]:40)}catch(e){}}
}
function showFloatText(text,color,x,y,big){
  const el=document.createElement('div');
  el.className='float-text';
  el.textContent=text;
  el.style.color=color||'#ffd84d';
  el.style.left=x+'px';
  el.style.top=y+'px';
  if(big)el.style.fontSize='42px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}
function elementCenter(el){
  const r=el.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}

let toastTimer;
function toast(msg,mercy){const el=$('toast');el.textContent=msg;el.classList.toggle('mercy',!!mercy);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function randomRoom(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let mqttClient=null;
const subs=new Map();
function setConnBadge(ok){const el=$('connBadge');if(ok)el.classList.add('ok');else{el.classList.remove('ok');el.textContent='连接中…'}}
function mqttConnect(){return new Promise((resolve,reject)=>{
  if(mqttClient&&mqttClient.connected)return resolve();
  if(typeof mqtt==='undefined'){$('connBadge').textContent='MQTT 库加载失败';return reject(new Error('mqtt lib missing'))}
  const cid='uno_'+Math.random().toString(16).slice(2,10);
  mqttClient=mqtt.connect(BROKER,{clientId:cid,clean:true,reconnectPeriod:4000,connectTimeout:12000,keepalive:30});
  let settled=false;
  mqttClient.on('connect',()=>{setConnBadge(true);subs.forEach((_,t)=>mqttClient.subscribe(t,{qos:0}));if(!settled){settled=true;resolve()}});
  mqttClient.on('reconnect',()=>setConnBadge(false));
  mqttClient.on('close',()=>setConnBadge(false));
  mqttClient.on('error',e=>{console.warn('[MQTT]',e&&e.message);if(!settled){settled=true;reject(e)}});
  mqttClient.on('message',(topic,payload)=>{const fns=subs.get(topic);if(!fns||!fns.length)return;let data;try{data=JSON.parse(payload.toString())}catch{return}fns.forEach(fn=>{try{fn(data)}catch(err){console.warn(err)}})});
})}
function mqttSub(topic,fn){if(!subs.has(topic)){subs.set(topic,[]);if(mqttClient&&mqttClient.connected)mqttClient.subscribe(topic,{qos:0})}const arr=subs.get(topic);if(!arr.includes(fn))arr.push(fn)}
function mqttPub(topic,obj){if(!mqttClient||!mqttClient.connected)return false;try{mqttClient.publish(topic,JSON.stringify(obj),{qos:0});return true}catch{return false}}

let cardIdSeq=0;
function buildDeck(mercy){
  const d=[];
  if(!mercy){
    for(const c of COLORS){
      d.push({color:c,value:'0',id:'c'+(cardIdSeq++)});
      for(let n=1;n<=9;n++){d.push({color:c,value:String(n),id:'c'+(cardIdSeq++)});d.push({color:c,value:String(n),id:'c'+(cardIdSeq++)})}
      for(const v of ['skip','reverse','draw2']){d.push({color:c,value:v,id:'c'+(cardIdSeq++)});d.push({color:c,value:v,id:'c'+(cardIdSeq++)})}
    }
    for(let i=0;i<4;i++){d.push({color:'wild',value:'wild',id:'c'+(cardIdSeq++)});d.push({color:'wild',value:'wild4',id:'c'+(cardIdSeq++)})}
  }else{
    for(const c of COLORS){
      d.push({color:c,value:'0',id:'c'+(cardIdSeq++)});
      for(let n=1;n<=9;n++){d.push({color:c,value:String(n),id:'c'+(cardIdSeq++)});d.push({color:c,value:String(n),id:'c'+(cardIdSeq++)})}
      for(const v of ['skip','reverse','draw2']){d.push({color:c,value:v,id:'c'+(cardIdSeq++)});d.push({color:c,value:v,id:'c'+(cardIdSeq++)})}
      for(const v of ['reverse_draw4','skip_everyone','discard_all']){for(let i=0;i<3;i++)d.push({color:c,value:v,id:'c'+(cardIdSeq++)})}
    }
    for(let i=0;i<8;i++){
      d.push({color:'wild',value:'wild',id:'c'+(cardIdSeq++)});
      d.push({color:'wild',value:'wild4',id:'c'+(cardIdSeq++)});
      d.push({color:'wild',value:'wild6',id:'c'+(cardIdSeq++)});
      d.push({color:'wild',value:'wild10',id:'c'+(cardIdSeq++)});
    }
  }
  return d;
}
function cardLabel(card){
  switch(card.value){
    case 'skip':return '⊘';case 'reverse':return '⇄';case 'draw2':return '+2';
    case 'wild':return '';case 'wild4':return '+4';case 'wild6':return '+6';case 'wild10':return '+10';
    case 'reverse_draw4':return '⇄+4';case 'skip_everyone':return '⊘⊘';case 'discard_all':return '✕';
    default:return card.value;
  }

/* ============ 语音识别 ============ */
function getSpeechRecognition(){
  return window.SpeechRecognition||window.webkitSpeechRecognition||null;
}

function runSpeechRecognition(){
  return new Promise((resolve)=>{
    const SR=getSpeechRecognition();
    if(!SR)return resolve({passed:false,reason:'浏览器不支持语音识别',heard:''});
    let recognition=null,timer=null,done=false,heardText='',aborted=false;
    let restartCount=0;const MAX_RESTART=4;
    const startTime=Date.now();

    const cleanup=()=>{
      if(timer){clearTimeout(timer);timer=null}
      if(recognition){
        try{recognition.onresult=null}catch(e){}
        try{recognition.onerror=null}catch(e){}
        try{recognition.onend=null}catch(e){}
        try{recognition.abort()}catch(e){}
      }
      G._unoAbort=null;
    };
    G._unoAbort=()=>{aborted=true;cleanup()};
    const finish=(result)=>{if(done)return;done=true;cleanup();resolve(result)};

    const start=()=>{
      try{recognition=new SR()}
      catch(e){return finish({passed:false,reason:'初始化失败',heard:''})}
      recognition.lang='zh-CN';
      recognition.continuous=true;
      recognition.interimResults=true;
      recognition.maxAlternatives=5;

      recognition.onresult=(e)=>{
        if(aborted||done)return;
        for(let i=e.resultIndex;i<e.results.length;i++){
          const transcript=(e.results[i][0]&&e.results[i][0].transcript)||'';
          heardText=transcript;
          const heardEl=$('unoHeard');
          if(heardEl)heardEl.textContent='「'+transcript+'」';
          const hint=$('unoMicHint');
          if(hint)hint.textContent=e.results[i].isFinal?'识别完成':'识别中…';
          if(UNO_SPEECH_KEYWORDS.test(transcript)){
            SFX.unoShoutOK();
            return finish({passed:true,reason:'',heard:transcript});
          }
        }
      };
      recognition.onerror=(e)=>{
        console.warn('[SR error]',e.error);
        if(done||aborted)return;
        if(e.error==='not-allowed'||e.error==='service-not-allowed'){
          return finish({passed:false,reason:'识别权限被拒绝',heard:heardText});
        }
        if(e.error==='audio-capture'){
          return finish({passed:false,reason:'麦克风异常',heard:heardText});
        }
        /* no-speech/network/aborted 忽略，由 onend 处理 */
      };
      recognition.onend=()=>{
        if(done||aborted)return;
        if(Date.now()-startTime>UNO_MIC_CHECK_MS){
          return finish({passed:false,reason:heardText?`听成了「${heardText}」`:'没有听清',heard:heardText});
        }
        if(restartCount<MAX_RESTART){
          restartCount++;
          setTimeout(()=>{if(done||aborted)return;try{recognition.start()}catch(e){}},150);
        }else{
          finish({passed:false,reason:heardText?`听成了「${heardText}」`:'识别服务中断',heard:heardText});
        }
      };
      try{recognition.start()}
      catch(e){return finish({passed:false,reason:'启动识别失败',heard:''})}
    };

    timer=setTimeout(()=>{
      if(done)return;
      finish({passed:false,reason:heardText?`听成了「${heardText}」`:'没有听清',heard:heardText});
    },UNO_MIC_CHECK_MS);

    start();
  });
}

/* ============ 音量检测（降级） ============ */
async function runVolumeCheck(stream){
  if(!stream)throw new Error('没有麦克风流');
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const src=ctx.createMediaStreamSource(stream);
  const an=ctx.createAnalyser();
  an.fftSize=1024;
  an.smoothingTimeConstant=0.15;
  src.connect(an);
  const data=new Uint8Array(an.frequencyBinCount);
  const startTime=Date.now();
  let quietFrames=0,quietDone=false,peak=0,loudFrames=0;
  const fill=$('unoMicFill');

  const passed=await new Promise(resolve=>{
    const check=()=>{
      an.getByteFrequencyData(data);
      let sum=0;
      for(let i=0;i<data.length;i++)sum+=data[i];
      const avg=sum/data.length;
      if(avg>peak)peak=avg;
      if(fill){
        const pct=Math.min(100,avg/255*100);
        fill.style.width=pct+'%';
        fill.classList.toggle('pass',avg>UNO_MIC_THRESHOLD);
      }
      const hint=$('unoMicHint');
      if(hint)hint.textContent=`音量 ${Math.round(avg)} / 需要 ${UNO_MIC_THRESHOLD}`;

      if(!quietDone){
        if(avg<25){quietFrames++;if(quietFrames>=UNO_MIC_MIN_QUIET)quietDone=true}
        else quietFrames=0;
      }
      if(quietDone&&avg>UNO_MIC_THRESHOLD){
        loudFrames++;
        if(loudFrames>=2)return resolve(true);
      }else loudFrames=0;
      if(peak>UNO_MIC_PEAK_THRESHOLD)return resolve(true);
      if(Date.now()-startTime>UNO_MIC_CHECK_MS)return resolve(false);
      requestAnimationFrame(check);
    };
    check();
  });
  try{ctx.close()}catch(e){}
  return passed;
}

/* ============ 喊 UNO 按钮 ============ */
$('unoShoutBtn').addEventListener('click',attemptUnoShout);

async function attemptUnoShout(){
  if(G._unoShouting)return;
  const btn=$('unoShoutBtn');
  btn.disabled=true;G._unoShouting=true;
  $('unoStatusHint').dataset.locked='1';
  $('unoHeard').textContent='—';

  /* 步骤1：确保有麦克风 */
  let stream=G._micStream;
  if(!stream||!stream.active){
    btn.textContent='🎤 准备麦克风…';
    $('unoStatusHint').textContent='正在请求麦克风权限…';
    $('unoMicHint').textContent='请允许浏览器使用麦克风';
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
      });
      G._micStream=stream;
      updateMicBadge(true,'已授权');
    }catch(e){
      let reason='麦克风不可用';
      if(e.name==='NotAllowedError')reason='麦克风权限被拒绝';
      else if(e.name==='NotFoundError')reason='未找到麦克风设备';
      updateMicBadge(false,'被拒绝');
      $('unoStatusHint').textContent='✗ '+reason;
      $('unoMicHint').textContent='罚摸 2 张';
      sendAction({type:'shoutUno',pid:G.pid,micPassed:false});
      setTimeout(()=>{
        $('unoOverlay').classList.add('hidden');_unoDisplayState='hidden';
        delete $('unoStatusHint').dataset.locked;
        SFX.penalty();G._unoShouting=false;
      },1500);
      return;
    }
  }

  /* 步骤2：开始识别 */
  btn.textContent='🎤 聆听中…';
  $('unoStatusHint').textContent='现在大声说：UNO！';
  $('unoMicHint').textContent='请清晰发音';
  SFX.listening();

  const hasSR=!!getSpeechRecognition();
  let result={passed:false,reason:'',heard:''};

  try{
    if(hasSR){
      result=await runSpeechRecognition();
    }else{
      $('unoMicHint').textContent='无语音识别，改用音量检测';
      const ok=await runVolumeCheck(stream);
      result=ok?{passed:true,reason:'',heard:''}:{passed:false,reason:'音量不够响',heard:''};
    }
  }catch(e){
    console.warn('[uno]',e);
    result={passed:false,reason:'识别出错',heard:''};
  }

  /* 步骤3：显示结果 */
  if(result.passed){
    $('unoStatusHint').textContent='✓ 通过！';
    $('unoMicHint').textContent='UNO 已确认';
  }else{
    $('unoStatusHint').textContent='✗ '+(result.reason||'未通过');
    $('unoMicHint').textContent='罚摸 2 张';
  }
  sendAction({type:'shoutUno',pid:G.pid,micPassed:result.passed});
  setTimeout(()=>{
    $('unoOverlay').classList.add('hidden');_unoDisplayState='hidden';
    delete $('unoStatusHint').dataset.locked;
    if(result.passed)SFX.unoShoutOK();else SFX.penalty();
    G._unoShouting=false;
  },result.passed?500:1500);
}

let lastActionTs=0,lastTopCardId=null,lastHandCount=0;

function handleTurnSeqChange(newSeq){
  if(G._lastSeenTurnSeq===newSeq)return;
  G._lastSeenTurnSeq=newSeq;
  clearLocalPlayLock();
}

function onStateMessage(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='lobby'){
    Host.lobbyPlayers=msg.players||[];
    Host.mercyMode=!!msg.mercyMode;
    G.joined=true;
    if(G.screen!=='lobby'&&G.screen!=='game')enterLobby();
    renderLobby();return;
  }
  if(msg.type==='state'){
    G.joined=true;
    const prevCurrent=G.pub&&G.pub.currentPid;
    G.pub=msg;
    if(prevCurrent!==msg.currentPid)G.selectedId=null;
    if(typeof msg.turnSeq==='number')handleTurnSeqChange(msg.turnSeq);
    G._lastSeenCurrentPid=msg.currentPid;

    if(msg.started&&!msg.winner&&typeof msg.turnRemainMs==='number'){
      _turnRemainMs=msg.turnRemainMs;_turnReceivedAt=Date.now();
    }else _turnRemainMs=0;

    if(msg.started){
      if(G.screen==='game'&&msg.lastAction&&msg.lastAction.ts>lastActionTs){
        lastActionTs=msg.lastAction.ts;handleActionFeedback(msg.lastAction,msg,true);
      }
      handleGameStart(msg);renderUnoOverlay();
    }else{
      _prevStarted=false;_inCountdown=false;_turnRemainMs=0;
      clearLocalPlayLock();
      if(G.screen==='game')switchScreen('lobby');
      $('unoOverlay').classList.add('hidden');_unoDisplayState='hidden';
      $('gameOver').classList.add('hidden');
      $('colorPicker').classList.add('hidden');
      $('startOverlay').classList.add('hidden');$('startOverlay').classList.remove('out');
      $('turnTimer').classList.add('hidden');
      G.selectedId=null;G.myHand=[];
      resetRenderCaches();renderLobby();
    }
    return;
  }
  if(msg.type==='toast'){toast(msg.msg,msg.mercy);return}
}

function handleActionFeedback(action,pub,prevStarted){
  if(!prevStarted&&action.type==='start')return;
  switch(action.type){
    case 'play':SFX.play();break;
    case 'draw':SFX.draw();break;
    case 'timeout':{
      SFX.timeout();shakeScreen(false);
      const target=document.querySelector(`.opponent[data-pid="${action.pid}"]`);
      if(target){const c=elementCenter(target);showFloatText('⏰ 超时','#ffb06a',c.x,c.y,true)}
      else if(action.pid===G.pid){showFloatText('⏰ 超时','#ffb06a',window.innerWidth/2,window.innerHeight*0.5,true);shakeScreen(true)}
      break;
    }
    case 'penalty':{
      SFX.penalty();
      const target=document.querySelector(`.opponent[data-pid="${action.targetPid}"]`);
      if(target){
        target.classList.add('penalty');
        setTimeout(()=>target.classList.remove('penalty'),550);
        const c=elementCenter(target);
        const color=action.value>=6?'#ff5c5c':'#ffb06a';
        showFloatText('+'+action.value,color,c.x,c.y,action.value>=6);
      }
      if(action.targetPid===G.pid)shakeScreen(action.value>=6);
      break;
    }
    case 'uno':{SFX.uno();if(action.pid===G.pid)showFloatText('UNO!','#ff5c5c',window.innerWidth/2,window.innerHeight*0.35,true);break}
    case 'unoShout':{
      SFX.unoShoutOK();
      const target=document.querySelector(`.opponent[data-pid="${action.pid}"]`);
      if(target){
        target.classList.add('uno-shout');
        setTimeout(()=>target.classList.remove('uno-shout'),900);
        const c=elementCenter(target);
        showFloatText('UNO!','#ffd84d',c.x,c.y,true);
      }else if(action.pid===G.pid){
        showFloatText('UNO!','#ffd84d',window.innerWidth/2,window.innerHeight*0.35,true);
      }
      break;
    }
    case 'unoPenalty':{
      SFX.penalty();shakeScreen(true);
      const target=document.querySelector(`.opponent[data-pid="${action.pid}"]`);
      if(target){
        target.classList.add('penalty');
        setTimeout(()=>target.classList.remove('penalty'),550);
        const c=elementCenter(target);
        showFloatText('+2 罚','#ff5c5c',c.x,c.y,true);
      }else if(action.pid===G.pid){
        showFloatText('+2 罚','#ff5c5c',window.innerWidth/2,window.innerHeight*0.35,true);
      }
      break;
    }
    case 'out':{
      SFX.penalty();shakeScreen(true);
      const target=document.querySelector(`.opponent[data-pid="${action.pid}"]`);
      if(target){const c=elementCenter(target);showFloatText('OUT','#ff8a8a',c.x,c.y,true)}
      break;
    }
    case 'win':{if(action.pid===G.pid)SFX.win();else SFX.lose();break}
  }
}

function hostBroadcastLobby(){
  if(!G.isHost||!G.room)return;
  const players=Host.players.map((p,i)=>({pid:p.pid,name:p.name,isBot:!!p.isBot,host:i===0}));
  mqttPub(PREFIX+G.room+'/state',{type:'lobby',players,mercyMode:!!Host.mercyMode});
  renderLobby();
}

function hostBroadcast(){
  if(!G.isHost||!G.room)return;
  if(Host.pendingUnoPid){
    const p=Host.players.find(x=>x.pid===Host.pendingUnoPid);
    if(!p||p.hand.length!==1||p.out)hostClearUnoCheck();
  }
  const top=Host.discard[Host.discard.length-1]||null;
  const players=Host.players.map(p=>({pid:p.pid,name:p.name,isBot:!!p.isBot,count:p.hand.length,out:!!p.out}));
  const turnRemainMs=(Host.started&&!Host.winner)?Math.max(0,TURN_TIME_MS-(Date.now()-Host.turnStartedAt)):null;
  const pendingUno=Host.pendingUnoPid?{
    pid:Host.pendingUnoPid,
    remainMs:Math.max(0,Host.pendingUnoDeadline-Date.now())
  }:null;
  const pub={
    type:'state',started:Host.started,players,
    currentPid:(Host.started&&!Host.winner)?Host.players[Host.currentIdx].pid:null,
    dir:Host.dir,topCard:top,currentColor:Host.currentColor,
    deckCount:Host.deck.length,drawnPid:Host.drawnBy,winner:Host.winner,
    mercyMode:!!Host.mercyMode,lastAction:Host.lastAction,
    turnRemainMs,turnSeq:Host.turnSeq,pendingUno
  };
  mqttPub(PREFIX+G.room+'/state',pub);
  for(const p of Host.players){
    if(p.isBot)continue;
    if(p.pid===G.pid)continue;
    mqttPub(PREFIX+G.room+'/h/'+p.pid,{type:'hand',cards:p.hand});
  }
  const me=Host.players.find(p=>p.pid===G.pid);
  if(me)G.myHand=me.hand;
  G.pub=pub;
  handleTurnSeqChange(pub.turnSeq);
  G._lastSeenCurrentPid=pub.currentPid;
  if(Host.started){
    if(G.screen==='game'&&Host.lastAction&&Host.lastAction.ts>lastActionTs){
      lastActionTs=Host.lastAction.ts;handleActionFeedback(Host.lastAction,pub,true);
    }
    handleGameStart(pub);renderUnoOverlay();
  }
}

function hostEvent(msg,mercy){
  if(!G.isHost||!G.room)return;
  mqttPub(PREFIX+G.room+'/state',{type:'toast',msg,mercy:!!mercy});
  toast(msg,mercy);
}

function hostStartUnoCheck(pid){
  hostClearUnoCheck();
  Host.pendingUnoPid=pid;
  Host.pendingUnoDeadline=Date.now()+UNO_WINDOW_MS;
  Host.pendingUnoTimer=setTimeout(()=>{
    if(Host.pendingUnoPid!==pid)return;
    hostPunishUno(pid);
  },UNO_WINDOW_MS);
}
function hostClearUnoCheck(){
  if(Host.pendingUnoTimer){clearTimeout(Host.pendingUnoTimer);Host.pendingUnoTimer=null}
  Host.pendingUnoPid=null;Host.pendingUnoDeadline=0;
}
function hostPunishUno(pid){
  const p=Host.players.find(x=>x.pid===pid);
  hostClearUnoCheck();
  if(p){
    hostDrawTo(p,2);hostCheckMercyAll();
    Host.lastAction={ts:Date.now(),type:'unoPenalty',pid};
    hostEvent(`💥 ${p.name} 没喊 UNO，罚摸 2 张`,true);
    hostBroadcast();
  }
  hostResumeAdvance();
}
function hostResumeAdvance(){
  if(Host.pendingAdvanceSkip===null||Host.pendingAdvanceSkip===undefined)return;
  const skip=Host.pendingAdvanceSkip;
  Host.pendingAdvanceSkip=null;
  if(!Host.started||Host.winner)return;
  hostAdvance(skip);
}

function hostStartTurnTimer(){
  hostClearTurnTimer();
  Host.turnStartedAt=Date.now();
  Host.turnTimer=setTimeout(hostHandleTurnTimeout,TURN_TIME_MS);
}
function hostClearTurnTimer(){if(Host.turnTimer){clearTimeout(Host.turnTimer);Host.turnTimer=null}}
function hostHandleTurnTimeout(){
  Host.turnTimer=null;
  if(!Host.started||Host.winner)return;
  const cur=Host.players[Host.currentIdx];
  if(!cur||cur.out)return;
  Host.lastAction={ts:Date.now(),type:'timeout',pid:cur.pid};
  hostEvent(`⏰ ${cur.name} 超时，自动过牌`);
  hostAdvance(0);
}

function wrapIdx(i){const n=Host.players.length;return((i%n)+n)%n}
function findNextAlive(startIdx,direction){
  let idx=startIdx;let guard=0;
  do{idx=wrapIdx(idx+direction);guard++}while(Host.players[idx].out&&guard<100);
  return idx;
}
function hostCheckMercyAll(){
  if(!Host.mercyMode)return false;
  let any=false;
  for(const p of Host.players){
    if(p.out)continue;
    if(p.hand.length>=MERCY_LIMIT){
      p.out=true;any=true;
      Host.lastAction={ts:Date.now(),type:'out',pid:p.pid};
      hostEvent(`💀 ${p.name} 手牌达 ${MERCY_LIMIT} 张，出局！`,true);
    }
  }
  return any;
}

function hostStartGame(){
  hostClearTurnTimer();hostClearUnoCheck();
  Host.pendingAdvanceSkip=null;
  Host.deck=shuffle(buildDeck(Host.mercyMode));
  Host.discard=[];Host.dir=1;Host.currentIdx=0;Host.winner=null;Host.drawnBy=null;
  for(const p of Host.players){p.hand=[];p.out=false}
  for(let r=0;r<7;r++)for(const p of Host.players)p.hand.push(Host.deck.pop());
  let guard=0;
  while(guard++<500&&Host.deck.length){
    const c=Host.deck.pop();
    if(['wild','wild4','wild6','wild10','skip','reverse','draw2','reverse_draw4','skip_everyone','discard_all'].includes(c.value)){Host.deck.unshift(c);continue}
    Host.discard.push(c);Host.currentColor=c.color;break;
  }
  Host.started=true;Host.turnSeq++;
  Host.lastAction={ts:Date.now(),type:'start'};
  hostStartTurnTimer();hostBroadcast();hostMaybeBot();
}

function hostIsPlayable(card){
  if(!Host.started||Host.winner)return false;
  if(card.color==='wild')return true;
  if(card.color===Host.currentColor)return true;
  const top=Host.discard[Host.discard.length-1];
  if(top&&top.color!=='wild'&&card.value===top.value)return true;
  return false;
}
function hostDrawTo(player,n){
  for(let i=0;i<n;i++){
    if(Host.deck.length===0){
      if(Host.discard.length<=1)break;
      const top=Host.discard.pop();
      Host.deck=shuffle(Host.discard);Host.discard=[top];
    }
    if(Host.deck.length===0)break;
    player.hand.push(Host.deck.pop());
  }
}
function hostAdvance(skip=0){
  if(!Host.started||Host.winner)return;
  hostClearTurnTimer();hostCheckMercyAll();
  const alive=Host.players.filter(p=>!p.out);
  if(alive.length<=1){
    Host.winner=alive[0]?alive[0].pid:null;
    if(Host.winner)Host.lastAction={ts:Date.now(),type:'win',pid:Host.winner};
    hostBroadcast();
    if(Host.winner){const w=Host.players.find(p=>p.pid===Host.winner);hostEvent(`🏆 ${w.name} 获胜！`)}
    return;
  }
  let idx=Host.currentIdx;
  const steps=skip+1;
  for(let i=0;i<steps;i++)idx=findNextAlive(idx,Host.dir);
  Host.currentIdx=idx;Host.drawnBy=null;Host.turnSeq++;
  hostStartTurnTimer();hostBroadcast();hostMaybeBot();
}

function hostHandlePlay(pid,cardId,color){
  if(!Host.started||Host.winner)return;
  const cur=Host.players[Host.currentIdx];
  if(!cur||cur.pid!==pid||cur.out)return;
  const idx=cur.hand.findIndex(c=>c.id===cardId);
  if(idx<0)return;
  const card=cur.hand[idx];
  if(!hostIsPlayable(card))return;

  cur.hand.splice(idx,1);
  Host.discard.push(card);
  Host.currentColor=card.color==='wild'?(COLORS.includes(color)?color:'red'):card.color;
  Host.drawnBy=null;
  Host.lastAction={ts:Date.now(),type:'play',pid,card};

  let dAllMsg='';
  if(card.value==='discard_all'){
    const cl=card.color;
    const removed=cur.hand.filter(c=>c.color===cl);
    cur.hand=cur.hand.filter(c=>c.color!==cl);
    if(removed.length){
      const top=Host.discard.pop();
      Host.discard.push(...removed);Host.discard.push(top);
      dAllMsg=`${cur.name} 弃掉 ${removed.length} 张${COLOR_NAME[cl]}牌`;
    }
  }

  if(cur.hand.length===0){
    Host.winner=cur.pid;
    Host.lastAction={ts:Date.now(),type:'win',pid:cur.pid};
    hostClearTurnTimer();hostClearUnoCheck();Host.pendingAdvanceSkip=null;
    hostBroadcast();hostEvent(`🏆 ${cur.name} 获胜！`);return;
  }

  let skip=0;const aliveCount=Host.players.filter(p=>!p.out).length;let customDelay=380;

  if(card.value==='skip'){skip=1}
  else if(card.value==='reverse'){Host.dir*=-1;if(aliveCount===2)skip=1}
  else if(card.value==='draw2'||card.value==='wild4'||card.value==='wild6'||card.value==='wild10'){
    const n=card.value==='draw2'?2:card.value==='wild4'?4:card.value==='wild6'?6:10;
    const vi=findNextAlive(Host.currentIdx,Host.dir);
    hostDrawTo(Host.players[vi],n);skip=1;
    Host.lastAction={ts:Date.now(),type:'penalty',pid,targetPid:Host.players[vi].pid,value:n};
    hostEvent(`💥 ${Host.players[vi].name} 摸 ${n} 张并跳过`,true);
    hostCheckMercyAll();
  }
  else if(card.value==='reverse_draw4'){
    Host.dir*=-1;
    const vi=findNextAlive(Host.currentIdx,Host.dir);
    hostDrawTo(Host.players[vi],4);skip=1;
    Host.lastAction={ts:Date.now(),type:'penalty',pid,targetPid:Host.players[vi].pid,value:4};
    hostEvent(`💥 方向反转，${Host.players[vi].name} 摸 4 张并跳过`,true);
    hostCheckMercyAll();
  }
  else if(card.value==='skip_everyone'){
    skip=Math.max(0,aliveCount-1);SFX.skip();
    let tmpIdx=Host.currentIdx;
    for(let i=0;i<=skip;i++)tmpIdx=findNextAlive(tmpIdx,Host.dir);
    if(Host.players[tmpIdx].pid===cur.pid)customDelay=200;
  }

  let unoTriggered=false;
  if(cur.hand.length===1){
    if(cur.isBot){
      hostEvent(`${cur.name}：UNO！`);
      Host.lastAction={ts:Date.now(),type:'unoShout',pid:cur.pid};
    }else unoTriggered=true;
  }else if(dAllMsg) hostEvent(dAllMsg);

  if(unoTriggered){
    Host.pendingAdvanceSkip=skip;
    hostStartUnoCheck(cur.pid);
  }

  hostBroadcast();

  if(!unoTriggered)setTimeout(()=>hostAdvance(skip),customDelay);
}

function hostHandleDraw(pid){
  if(!Host.started||Host.winner)return;
  const cur=Host.players[Host.currentIdx];
  if(!cur||cur.pid!==pid||cur.out)return;
  if(Host.drawnBy===pid)return;
  hostDrawTo(cur,1);
  Host.drawnBy=pid;
  Host.lastAction={ts:Date.now(),type:'draw',pid};
  hostCheckMercyAll();hostBroadcast();
  if(cur.out){
    setTimeout(()=>{if(!Host.winner&&Host.players[Host.currentIdx]===cur)hostAdvance(0)},900);return;
  }
  const drawn=cur.hand[cur.hand.length-1];
  if(drawn&&!hostIsPlayable(drawn)){
    hostEvent(`${cur.name} 摸牌后无法出牌，自动跳过`);
    setTimeout(()=>{if(!Host.winner&&Host.drawnBy===pid)hostAdvance(0)},800);
  }
}
function hostHandlePass(pid){
  if(!Host.started||Host.winner)return;
  const cur=Host.players[Host.currentIdx];
  if(!cur||cur.pid!==pid||cur.out)return;
  if(Host.drawnBy!==pid)return;
  hostAdvance(0);
}
function hostScoreCard(c){
  if(c.color==='wild')return c.value==='wild10'?3:c.value==='wild6'?4:c.value==='wild4'?5:10;
  switch(c.value){
    case 'draw2':return 100;case 'skip':return 96;case 'reverse':return 92;
    case 'reverse_draw4':return 98;case 'skip_everyone':return 94;case 'discard_all':return 88;
    default:return 50+(parseInt(c.value,10)||0);
  }
}
function hostBestColor(player){
  const cnt={red:0,yellow:0,green:0,blue:0};
  for(const c of player.hand)if(c.color!=='wild')cnt[c.color]++;
  let best='red',max=-1;
  for(const c of COLORS)if(cnt[c]>max){max=cnt[c];best=c}
  return best;
}
function hostMaybeBot(){
  if(!Host.started||Host.winner)return;
  if(Host.pendingUnoPid)return;
  const cur=Host.players[Host.currentIdx];
  if(!cur||!cur.isBot||cur.out)return;
  setTimeout(()=>{
    if(!Host.started||Host.winner)return;
    if(Host.pendingUnoPid)return;
    if(Host.players[Host.currentIdx]!==cur)return;
    hostBotTurn();
  },850);
}
function hostBotTurn(){
  const cur=Host.players[Host.currentIdx];
  if(!cur||!cur.isBot||cur.out)return;
  const playable=cur.hand.filter(hostIsPlayable);
  if(playable.length===0){
    hostDrawTo(cur,1);
    Host.lastAction={ts:Date.now(),type:'draw',pid:cur.pid};
    hostCheckMercyAll();hostBroadcast();
    if(cur.out){
      setTimeout(()=>{if(!Host.started||Host.winner)return;if(Host.players[Host.currentIdx]===cur)hostAdvance(0)},650);return;
    }
    const drawn=cur.hand[cur.hand.length-1];
    setTimeout(()=>{
      if(!Host.started||Host.winner)return;
      if(Host.players[Host.currentIdx]!==cur)return;
      if(drawn&&hostIsPlayable(drawn))hostHandlePlay(cur.pid,drawn.id,drawn.color==='wild'?hostBestColor(cur):null);
      else{hostEvent(`${cur.name} 摸牌后跳过`);hostAdvance(0)}
    },650);
    return;
  }
  const pick=playable.slice().sort((a,b)=>hostScoreCard(b)-hostScoreCard(a))[0];
  setTimeout(()=>{
    if(!Host.started||Host.winner)return;
    if(Host.players[Host.currentIdx]!==cur)return;
    hostHandlePlay(cur.pid,pick.id,pick.color==='wild'?hostBestColor(cur):null);
  },420);
}

function hostReturnToLobby(){
  if(!G.isHost||!G.room)return;
  hostClearTurnTimer();hostClearUnoCheck();
  Host.pendingAdvanceSkip=null;
  clearLocalPlayLock();
  Host.started=false;Host.winner=null;
  Host.deck=[];Host.discard=[];
  Host.currentIdx=0;Host.dir=1;Host.currentColor=null;
  Host.drawnBy=null;Host.lastAction=null;
  Host.turnStartedAt=0;Host.turnSeq=0;
  for(const p of Host.players){p.hand=[];p.out=false}
  G.selectedId=null;G.myHand=[];G.pub=null;
  G._lastSeenCurrentPid=null;G._lastSeenTurnSeq=null;G._unoShouting=false;
  resetTransitionFlags();resetRenderCaches();
  lastActionTs=0;lastTopCardId=null;lastHandCount=0;_turnRemainMs=0;
  _unoDisplayState='hidden';
  $('unoOverlay').classList.add('hidden');
  $('gameOver').classList.add('hidden');
  $('colorPicker').classList.add('hidden');
  $('startOverlay').classList.add('hidden');$('startOverlay').classList.remove('out');
  $('turnTimer').classList.add('hidden');
  const lobbyPlayers=Host.players.map((p,i)=>({pid:p.pid,name:p.name,isBot:!!p.isBot,host:i===0}));
  mqttPub(PREFIX+G.room+'/state',{type:'lobby',players:lobbyPlayers,mercyMode:!!Host.mercyMode});
  mqttPub(PREFIX+G.room+'/state',{
    type:'state',started:false,
    players:Host.players.map(p=>({pid:p.pid,name:p.name,isBot:!!p.isBot,count:0,out:false})),
    currentPid:null,dir:1,topCard:null,currentColor:null,
    deckCount:0,drawnPid:null,winner:null,
    mercyMode:!!Host.mercyMode,lastAction:null,turnRemainMs:null,turnSeq:0,pendingUno:null
  });
  switchScreen('lobby');renderLobby();
  SFX.pop();toast('已返回房间');
}

function hostOnAction(msg){
  if(!msg||!msg.type)return;
  switch(msg.type){
    case 'join':{
      if(!G.isHost||Host.started)return;
      if(Host.players.length>=4){hostEvent('房间已满（最多 4 人）');return}
      if(Host.players.some(p=>p.pid===msg.pid))return;
      Host.players.push({pid:msg.pid,name:String(msg.name||'玩家').slice(0,8),hand:[],isBot:false,out:false});
      hostBroadcastLobby();hostEvent(`${msg.name} 加入了房间`);
      break;
    }
    case 'leave':{
      if(!G.isHost)return;
      const i=Host.players.findIndex(p=>p.pid===msg.pid);
      if(i<0)return;
      if(Host.pendingUnoPid===msg.pid){hostClearUnoCheck();Host.pendingAdvanceSkip=null}
      if(Host.started&&!Host.winner){
        hostEvent(`${Host.players[i].name} 离开了游戏（托管）`);
        Host.players[i].isBot=true;Host.players[i].name+='(托管)';
        hostBroadcast();hostMaybeBot();return;
      }
      const name=Host.players[i].name;
      Host.players.splice(i,1);
      if(Host.players.length===0){Host.active=false;hostClearTurnTimer();hostClearUnoCheck();Host.pendingAdvanceSkip=null;return}
      if(Host.currentIdx>=Host.players.length)Host.currentIdx=0;
      hostBroadcastLobby();hostEvent(`${name} 离开了房间`);
      break;
    }
    case 'start':if(G.isHost&&msg.pid===G.pid)hostStartGame();break;
    case 'play':if(G.isHost)hostHandlePlay(msg.pid,msg.cardId,msg.color);break;
    case 'draw':if(G.isHost)hostHandleDraw(msg.pid);break;
    case 'pass':if(G.isHost)hostHandlePass(msg.pid);break;
    case 'returnLobby':if(G.isHost&&msg.pid===G.pid)hostReturnToLobby();break;
    case 'shoutUno':{
      if(!G.isHost)return;
      if(Host.pendingUnoPid!==msg.pid)return;
      const p=Host.players.find(x=>x.pid===msg.pid);
      if(!p)return;
      if(msg.micPassed){
        hostClearUnoCheck();
        Host.lastAction={ts:Date.now(),type:'unoShout',pid:msg.pid};
        hostEvent(`${p.name}：UNO！`);
        hostBroadcast();hostResumeAdvance();
      }else hostPunishUno(msg.pid);
      break;
    }
  }
}
function sendAction(obj){
  if(!G.room)return;
  if(G.isHost)hostOnAction(obj);
  else mqttPub(PREFIX+G.room+'/action',obj);
}

function renderGame(){
  if(!G.pub||!G.pub.started)return;
  renderOpponents();renderTable();renderHand();renderStatus();
  $('mercyBadge').classList.toggle('hidden',!G.pub.mercyMode);
}
function orderPlayers(){
  const pub=G.pub;if(!pub||!pub.players)return[];
  const meIdx=pub.players.findIndex(p=>p.pid===G.pid);
  if(meIdx<0)return pub.players.slice();
  const arr=[];
  for(let i=1;i<pub.players.length;i++)arr.push(pub.players[(meIdx+i)%pub.players.length]);
  return arr;
}
function renderOpponents(){
  const wrapEl=$('opponents');const list=orderPlayers();const pub=G.pub;
  const pidsKey=list.map(p=>p.pid).join(',');
  if(wrapEl.dataset.pids!==pidsKey){
    wrapEl.innerHTML='';
    list.forEach(p=>{
      const div=document.createElement('div');
      div.className='opponent';
      div.setAttribute('data-pid',p.pid);
      div.innerHTML='<div class="opp-name"></div><div class="opp-cards"></div><div class="opp-count"></div>';
      wrapEl.appendChild(div);
    });
    wrapEl.dataset.pids=pidsKey;
  }
  list.forEach((p,i)=>{
    const div=wrapEl.children[i];if(!div)return;
    const isActive=pub.currentPid===p.pid&&!pub.winner;
    div.classList.toggle('active',isActive);
    div.classList.toggle('out',!!p.out);
    const nameEl=div.querySelector('.opp-name');
    if(nameEl.textContent!==p.name)nameEl.textContent=p.name;
    const cardsEl=div.querySelector('.opp-cards');
    const show=p.out?0:Math.min(p.count,9);
    if(cardsEl.dataset.show!==String(show)){
      cardsEl.innerHTML='';
      for(let j=0;j<show;j++){const m=document.createElement('div');m.className='mini-back';cardsEl.appendChild(m)}
      cardsEl.dataset.show=String(show);
    }
    const countEl=div.querySelector('.opp-count');
    let countText,countCls;
    if(p.out){countText='出局';countCls='opp-count out'}
    else if(p.count===1){countText='UNO!';countCls='opp-count uno'}
    else{countText=p.count+' 张';countCls='opp-count'+((pub.mercyMode&&p.count>=20)?' warn':'')}
    if(countEl.textContent!==countText)countEl.textContent=countText;
    if(countEl.className!==countCls)countEl.className=countCls;
  });
}
function renderTable(){
  const drawPile=$('drawPile');
  const n=Math.min(G.pub.deckCount||0,3);
  if(drawPile.dataset.n!==String(n)){
    drawPile.innerHTML='';
    for(let i=0;i<n;i++){
      const b=createBackEl();const off=(n-1-i)*3;
      b.style.transform=`translate(${off}px, ${-off}px)`;
      drawPile.appendChild(b);
    }
    drawPile.dataset.n=String(n);
  }
  $('deckCount').textContent=G.pub.deckCount||0;
  const discardPile=$('discardPile');
  const top=G.pub.topCard;const topId=top?top.id:'';
  if(discardPile.dataset.topId!==topId){
    discardPile.innerHTML='';
    if(top){
      const el=createCardEl(top);
      if(topId!==lastTopCardId){lastTopCardId=topId;el.classList.add('just-dropped')}
      discardPile.appendChild(el);
    }
    discardPile.dataset.topId=topId;
  }
  const dot=$('colorDot');const c=G.pub.currentColor;
  if(c&&dot.dataset.color!==c){
    dot.style.background=`var(--${c})`;
    dot.style.boxShadow=`0 0 10px var(--${c})`;
    dot.dataset.color=c;
  }
}
function clientCanPlay(card){
  const pub=G.pub;
  if(!pub||!pub.started||pub.winner)return false;
  if(pub.pendingUno)return false;
  if(pub.currentPid!==G.pid)return false;
  if(G.localPlayLock)return false;
  const me=pub.players.find(p=>p.pid===G.pid);
  if(me&&me.out)return false;
  if(card.color==='wild')return true;
  if(card.color===pub.currentColor)return true;
  const top=pub.topCard;
  if(top&&top.color!=='wild'&&card.value===top.value)return true;
  return false;
}
function renderHand(){
  const el=$('hand');const hand=G.myHand||[];
  if(G.selectedId){
    const still=hand.find(c=>c.id===G.selectedId);
    if(!still||!clientCanPlay(still))G.selectedId=null;
  }
  const gotNewCard=hand.length>lastHandCount&&lastHandCount>0;
  const newCardId=gotNewCard&&hand.length?hand[hand.length-1].id:null;
  const stagger=_staggerHand;if(stagger)_staggerHand=false;
  const ids=hand.map(c=>c.id).join(',');
  const needRebuild=ids!==_lastHandIds||stagger;
  if(needRebuild){
    el.innerHTML='';
    hand.forEach((card,i)=>{
      const c=createCardEl(card);
      const canPlay=clientCanPlay(card);
      if(canPlay)c.classList.add('playable');
      if(G.selectedId===card.id)c.classList.add('selected');
      if(newCardId===card.id)c.classList.add('newly-drawn');
      if(stagger){c.classList.add('stagger-in');c.style.animationDelay=(i*55)+'ms'}
      c.addEventListener('click',()=>onCardClick(card));
      el.appendChild(c);
    });
    _lastHandIds=ids;
  }else{
    Array.from(el.children).forEach((cEl,i)=>{
      const card=hand[i];if(!card)return;
      const canPlay=clientCanPlay(card);
      cEl.classList.toggle('playable',canPlay);
      cEl.classList.toggle('selected',G.selectedId===card.id);
    });
  }
  lastHandCount=hand.length;
  const me=G.pub&&G.pub.players.find(p=>p.pid===G.pid);
  $('outHint').classList.toggle('hidden',!(me&&me.out&&!G.pub.winner));
  updatePlayBtn();scheduleLayout();
}
function renderStatus(){
  const st=$('status'),passBtn=$('passBtn'),pub=G.pub;
  if(!pub)return;
  if(pub.winner){st.textContent='游戏结束';passBtn.classList.add('hidden');return}
  const me=pub.players.find(p=>p.pid===G.pid);
  if(me&&me.out){st.textContent='已出局 · 观战';passBtn.classList.add('hidden');return}
  let txt;
  if(pub.pendingUno&&pub.pendingUno.pid===G.pid)txt='⚡ 快喊 UNO！';
  else if(pub.pendingUno){const u=pub.players.find(p=>p.pid===pub.pendingUno.pid);txt=u?`${u.name} 正在喊 UNO…`:'等待喊 UNO…'}
  else if(G.localPlayLock&&pub.currentPid===G.pid)txt='出牌中…';
  else if(pub.currentPid===G.pid){
    if(G.selectedId){const c=G.myHand.find(x=>x.id===G.selectedId);txt=c?'已选：'+cardDesc(c):'轮到你出牌'}
    else txt=pub.drawnPid===G.pid?'出牌或过牌':'轮到你出牌';
  }else{const cur=pub.players.find(p=>p.pid===pub.currentPid);txt=cur?`${cur.name} 思考中…`:''}
  if(st.textContent!==txt)st.textContent=txt;
  const showPass=pub.currentPid===G.pid&&pub.drawnPid===G.pid&&!pub.winner&&!G.localPlayLock&&!pub.pendingUno;
  passBtn.classList.toggle('hidden',!showPass);
}
function updatePlayBtn(){
  const btn=$('playBtn');if(!btn)return;
  const pub=G.pub;
  const can=!!G.selectedId&&pub&&pub.started&&!pub.winner&&pub.currentPid===G.pid&&!G.localPlayLock&&!pub.pendingUno;
  if(btn.disabled===can)btn.disabled=!can;
}
function getBaseCardSize(){return window.innerWidth<=520?{w:56,h:84}:{w:66,h:99}}
function layoutHand(){
  const area=$('handArea'),hand=$('hand');
  if(!area||!hand)return;
  const cards=hand.querySelectorAll('.card');const n=cards.length;
  if(!n){hand.style.removeProperty('--card-w');hand.style.removeProperty('--card-h');hand.style.width='';return}
  const base=getBaseCardSize();const cw0=base.w;
  const areaW=Math.max(area.clientWidth-20,120);
  let cw=cw0,step;const MIN_RATIO=0.42,MIN_CW=32;
  if(n===1)step=cw;
  else{
    step=(areaW-cw)/(n-1);
    if(step<cw*MIN_RATIO){cw=areaW/(1+(n-1)*MIN_RATIO);cw=Math.max(cw,MIN_CW);cw=Math.min(cw,cw0);step=cw*MIN_RATIO}
    else step=Math.min(step,cw0+6);
  }
  const ch=base.h*(cw/cw0);
  hand.style.setProperty('--card-w',cw+'px');
  hand.style.setProperty('--card-h',ch+'px');
  hand.style.width=(cw+step*(n-1))+'px';
  cards.forEach((c,i)=>{c.style.marginLeft=i===0?'0px':(step-cw)+'px'});
}
let _layoutRaf=0;
function scheduleLayout(){
  cancelAnimationFrame(_layoutRaf);
  _layoutRaf=requestAnimationFrame(()=>{_layoutRaf=requestAnimationFrame(layoutHand)});
}
window.addEventListener('resize',()=>{if(G.screen==='game')scheduleLayout()});

function onCardClick(card){
  initAudio();
  const pub=G.pub;
  if(!pub||!pub.started||pub.winner)return;
  if(pub.pendingUno){toast('等待喊 UNO 完成…');return}
  if(G.localPlayLock){toast('出牌中，请稍候…');return}
  if(pub.currentPid!==G.pid){toast('还没轮到你');return}
  if(!clientCanPlay(card)){toast('这张牌不能出');SFX.click();return}
  SFX.click();
  if(G.selectedId===card.id)G.selectedId=null;
  else G.selectedId=card.id;
  renderHand();renderStatus();
}
function onPlayBtnClick(){
  initAudio();
  const pub=G.pub;
  if(!pub||!pub.started||pub.winner)return;
  if(pub.pendingUno)return;
  if(G.localPlayLock)return;
  if(pub.currentPid!==G.pid){toast('还没轮到你');return}
  if(!G.selectedId){toast('请先选择一张牌');return}
  const card=G.myHand.find(c=>c.id===G.selectedId);
  if(!card){G.selectedId=null;renderHand();renderStatus();return}
  if(!clientCanPlay(card)){toast('这张牌不能出');G.selectedId=null;renderHand();renderStatus();return}
  SFX.pop();setLocalPlayLock();
  const cid=card.id;G.selectedId=null;
  renderHand();renderStatus();
  if(card.color==='wild')showColorPicker(color=>sendAction({type:'play',pid:G.pid,cardId:cid,color}));
  else sendAction({type:'play',pid:G.pid,cardId:cid,color:null});
}
$('playBtn').addEventListener('click',onPlayBtnClick);
$('drawPile').addEventListener('click',()=>{
  initAudio();
  const pub=G.pub;
  if(!pub||!pub.started||pub.winner)return;
  if(pub.pendingUno)return;
  if(G.localPlayLock)return;
  if(pub.currentPid!==G.pid){toast('还没轮到你');return}
  if(pub.drawnPid===G.pid){toast('本回合已经摸过牌了');return}
  SFX.click();G.selectedId=null;renderHand();
  sendAction({type:'draw',pid:G.pid});
});
$('passBtn').addEventListener('click',()=>{
  const pub=G.pub;
  if(!pub||pub.currentPid!==G.pid)return;
  if(pub.drawnPid!==G.pid)return;
  if(G.localPlayLock)return;
  if(pub.pendingUno)return;
  SFX.click();G.selectedId=null;setLocalPlayLock();renderHand();
  sendAction({type:'pass',pid:G.pid});
});
function showColorPicker(cb){
  const el=$('colorPicker');
  el.classList.remove('hidden');
  const handler=e=>{
    const btn=e.target.closest('[data-color]');
    if(!btn)return;
    SFX.click();el.classList.add('hidden');
    el.removeEventListener('click',handler);
    cb(btn.dataset.color);
  };
  el.addEventListener('click',handler);
}
function showGameOver(pub){
  const el=$('gameOver');el.classList.remove('hidden');
  const winner=pub.players.find(p=>p.pid===pub.winner);
  const iWin=pub.winner===G.pid;
  $('goTitle').textContent=iWin?'🎉 你赢了！':(winner?`${winner.name} 获胜`:'游戏结束');
  $('goSub').textContent=iWin?'恭喜你打完了所有手牌':'再接再厉，下一局翻盘！';
  $('returnRoomBtn').classList.toggle('hidden',!G.isHost);
  $('waitHostHint').classList.toggle('hidden',G.isHost);
}
$('returnRoomBtn').addEventListener('click',()=>{
  if(!G.isHost)return;
  SFX.click();hostReturnToLobby();
});

window.addEventListener('beforeunload',()=>{
  if(G.room&&!G.isHost&&G.joined)mqttPub(PREFIX+G.room+'/action',{type:'leave',pid:G.pid});
});

(function boot(){
  $('nameInput').value='玩家'+G.pid.slice(1,4).toUpperCase();
  updateSoundBtn();
  mqttConnect().catch(()=>{});
  switchScreen('home');
})();
</script>
</body>
