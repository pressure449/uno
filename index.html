<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UNO 联机版 · MQTT</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --red:#e63946; --yellow:#e8a900; --green:#2a9d54; --blue:#2b7fd4;
  --card-w:66px; --card-h:99px;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at 50% 38%, #1c7a4c 0%, #0a3a22 68%, #041d0d 100%);
  color:#fff; overflow:hidden; user-select:none;
}
#app{ height:100dvh; position:relative; overflow:hidden; }
.screen{ position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; }
.hidden{ display:none !important; }

/* ============ 通用按钮 ============ */
.btn-primary{
  background:#ffd84d; color:#1a1a1a; border:none; border-radius:24px;
  padding:12px 28px; font-size:15px; font-weight:900; cursor:pointer;
  box-shadow:0 4px 0 #b99a1e; transition:.15s; font-family:inherit;
}
.btn-primary:active{ transform:translateY(3px); box-shadow:0 1px 0 #b99a1e; }
.btn-primary:disabled{ opacity:.4; cursor:not-allowed; box-shadow:0 4px 0 #5a4c14; }
.btn-secondary{
  background:rgba(255,255,255,.14); color:#fff; border:2px solid rgba(255,255,255,.3);
  border-radius:24px; padding:11px 24px; font-size:15px; font-weight:800;
  cursor:pointer; transition:.15s; font-family:inherit;
}
.btn-secondary:active{ transform:scale(.96); }
.btn-ghost{
  background:transparent; color:rgba(255,255,255,.75); border:1.5px solid rgba(255,255,255,.28);
  border-radius:20px; padding:9px 20px; font-size:13px; font-weight:700;
  cursor:pointer; transition:.15s; font-family:inherit;
}
.btn-ghost:active{ transform:scale(.96); }

/* ============ 首页 ============ */
#screenHome{ align-items:center; justify-content:center; padding:24px; }
.home-card{
  width:100%; max-width:360px;
  background:linear-gradient(160deg, rgba(30,42,36,.92), rgba(13,26,19,.95));
  border:2px solid rgba(255,216,77,.28);
  border-radius:24px; padding:34px 28px 28px;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
  display:flex; flex-direction:column; gap:14px;
}
.brand-big{
  font-size:52px; font-weight:900; font-style:italic; letter-spacing:2px;
  text-align:center; color:#ffd84d; line-height:1;
  text-shadow:3px 3px 0 #b3202c, 6px 6px 16px rgba(0,0,0,.6);
}
.home-sub{
  text-align:center; font-size:12px; letter-spacing:4px;
  color:rgba(255,255,255,.5); font-weight:700; margin-bottom:8px;
}
.home-card input{
  width:100%; background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.16);
  border-radius:14px; padding:13px 16px; color:#fff; font-size:15px;
  font-family:inherit; outline:none; transition:.2s;
}
.home-card input:focus{ border-color:rgba(255,216,77,.65); background:rgba(0,0,0,.5); }
.home-card input::placeholder{ color:rgba(255,255,255,.32); }
.home-row{ display:flex; gap:10px; }
.home-row .btn-primary, .home-row .btn-secondary{ flex:1; }
.home-row input{ flex:1.2; text-transform:uppercase; letter-spacing:2px; font-weight:800; }
.home-divider{
  display:flex; align-items:center; gap:12px;
  color:rgba(255,255,255,.28); font-size:11px; font-weight:700;
}
.home-divider::before, .home-divider::after{
  content:''; flex:1; height:1px; background:rgba(255,255,255,.14);
}
.home-tip{
  min-height:18px; text-align:center; font-size:12px;
  color:#ff9a9a; font-weight:600;
}

/* ============ 大厅 ============ */
#screenLobby{ align-items:center; justify-content:center; padding:24px; }
.lobby-card{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, rgba(30,42,36,.92), rgba(13,26,19,.95));
  border:2px solid rgba(255,216,77,.28);
  border-radius:24px; padding:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.lobby-title{
  font-size:15px; font-weight:700; color:rgba(255,255,255,.65);
  text-align:center; margin-bottom:6px;
}
.lobby-title span{
  display:inline-block; font-size:26px; font-weight:900; letter-spacing:5px;
  color:#ffd84d; vertical-align:middle; margin-left:6px;
  text-shadow:0 2px 8px rgba(255,216,77,.4);
}
.lobby-hint{
  text-align:center; font-size:12px; color:rgba(255,255,255,.42);
  margin-bottom:18px; font-weight:600;
}
.lobby-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.lobby-item{
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.1);
  border-radius:14px; padding:11px 14px; font-size:14px; font-weight:700;
  animation:slideIn .3s ease;
}
@keyframes slideIn{ from{ opacity:0; transform:translateX(-10px); } }
.lobby-item .avatar{
  width:30px; height:30px; border-radius:50%; flex:none;
  display:grid; place-items:center; font-size:14px; font-weight:900;
  background:linear-gradient(135deg,#ffd84d,#e8a900); color:#1a1a1a;
}
.lobby-item.is-bot .avatar{ background:linear-gradient(135deg,#7a8fa6,#4a5b6e); color:#fff; }
.lobby-item .tag{
  margin-left:auto; font-size:10px; font-weight:800; padding:3px 8px;
  border-radius:10px; background:rgba(255,216,77,.18); color:#ffd84d;
}
.lobby-item .tag.host{ background:rgba(255,92,92,.18); color:#ff8a8a; }
.lobby-actions{ display:flex; flex-direction:column; gap:10px; }
.lobby-actions .btn-primary{ width:100%; }

/* ============ 游戏界面 ============ */
#screenGame{ }
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; flex:none; gap:10px;
}
.brand{
  font-size:22px; font-weight:900; font-style:italic; letter-spacing:1px;
  color:#ffd84d; text-shadow:2px 2px 0 #b3202c, 3px 3px 8px rgba(0,0,0,.5);
  flex:none;
}
#roomBadge{
  font-size:10px; font-weight:800; letter-spacing:1.5px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16);
  padding:4px 10px; border-radius:12px; color:rgba(255,255,255,.7);
  flex:none;
}
#status{ font-size:13px; font-weight:600; opacity:.9; flex:1; text-align:right; }
#passBtn{
  background:#ffd84d; color:#1a1a1a; border:none; border-radius:20px;
  padding:8px 18px; font-size:13px; font-weight:800; cursor:pointer;
  box-shadow:0 3px 0 #b99a1e; transition:.15s; flex:none; font-family:inherit;
}
#passBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #b99a1e; }

#opponents{
  display:flex; justify-content:center; gap:10px; padding:2px 10px 0;
  flex:none; flex-wrap:wrap;
}
.opponent{
  background:rgba(0,0,0,.28);
  border:2px solid rgba(255,255,255,.08);
  border-radius:14px; padding:7px 11px; min-width:98px;
  text-align:center; transition:.35s;
}
.opponent.active{
  border-color:#ffd84d;
  background:rgba(255,216,77,.16);
  box-shadow:0 0 22px rgba(255,216,77,.4);
  transform:translateY(-2px);
}
.opp-name{
  font-size:11px; font-weight:700; margin-bottom:5px; opacity:.95;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px;
}
.opp-cards{ display:flex; justify-content:center; height:20px; }
.mini-back{
  width:14px; height:20px; border-radius:3px; background:#141414;
  border:1px solid rgba(255,255,255,.85); flex:none;
}
.opp-cards .mini-back + .mini-back{ margin-left:-8px; }
.opp-count{ font-size:10px; margin-top:5px; opacity:.75; font-weight:600; }
.opp-count.uno{ color:#ff5c5c; font-weight:900; animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.45; } }

#table{
  flex:1; display:flex; align-items:center; justify-content:center;
  gap:52px; min-height:0; padding:8px;
}
.pile-slot{ display:flex; flex-direction:column; align-items:center; gap:9px; }
.pile{ position:relative; width:var(--card-w); height:var(--card-h); }
.pile .card{ position:absolute; inset:0; }
#drawPile{ cursor:pointer; }
#drawPile:active{ transform:scale(.96); }
.pile-label{
  font-size:11px; font-weight:700; opacity:.7; letter-spacing:.5px;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}
.dot{
  width:12px; height:12px; border-radius:50%; display:inline-block;
  background:var(--red); box-shadow:0 0 8px currentColor; transition:.25s;
}

/* ============ 卡牌 ============ */
.card{
  width:var(--card-w); height:var(--card-h);
  border-radius:9px; background:#fff; padding:3px;
  position:relative; flex:none;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
}
.card .face{
  width:100%; height:100%; border-radius:7px; position:relative;
  display:grid; place-items:center; overflow:hidden; background:var(--c);
}
.card .oval{
  position:absolute; width:165%; height:64%; background:#fff;
  border-radius:50%; transform:rotate(-33deg);
}
.card .label{
  position:relative; z-index:2; line-height:1;
  font-size:calc(var(--card-h) * .3);
  font-weight:900; font-style:italic; color:var(--c); letter-spacing:-1px;
}
.face.red{ --c:var(--red); }
.face.yellow{ --c:var(--yellow); }
.face.green{ --c:var(--green); }
.face.blue{ --c:var(--blue); }
.face.wild{
  --c:#fff;
  background:conic-gradient(from 45deg,
    var(--red) 0 25%, var(--yellow) 0 50%,
    var(--green) 0 75%, var(--blue) 0);
}
.face.wild .label{
  font-size:calc(var(--card-h) * .26);
  text-shadow:0 2px 5px rgba(0,0,0,.65); letter-spacing:0;
}
.card.back .face{ --c:#141414; background:#141414; }
.card.back .oval{ width:150%; height:58%; background:var(--red); }
.card.back .label{
  color:#fff; font-size:calc(var(--card-h) * .19);
  font-style:italic; letter-spacing:-.5px;
  transform:rotate(-33deg); text-shadow:0 1px 3px rgba(0,0,0,.5);
}

/* ============ 手牌 ============ */
#handArea{
  height:172px; flex:none;
  display:flex; align-items:flex-end; justify-content:flex-start;
  padding:0 10px 14px; overflow-x:auto; overflow-y:hidden;
}
#hand{
  display:flex; align-items:flex-end; padding-top:36px;
  margin:0 auto; flex:0 0 auto;
}
#hand .card{ position:relative; transition:transform .18s ease, box-shadow .18s ease; }
#hand .card + .card{ margin-left:-16px; }
#hand .card:not(.playable){ filter:brightness(.55) saturate(.65); }
#hand .card.playable{
  cursor:pointer;
  box-shadow:0 0 0 2px rgba(255,216,77,.9), 0 4px 12px rgba(0,0,0,.5);
}
#hand .card.playable:hover{ transform:translateY(-20px) scale(1.04); z-index:20; }

/* ============ Toast ============ */
#toast{
  position:fixed; left:50%; bottom:186px; transform:translate(-50%,12px);
  background:rgba(0,0,0,.84); color:#fff; padding:10px 22px;
  border-radius:22px; font-size:13px; font-weight:700;
  opacity:0; pointer-events:none; transition:.28s; z-index:200;
  white-space:nowrap; border:1px solid rgba(255,255,255,.12);
  max-width:88vw; overflow:hidden; text-overflow:ellipsis;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

/* ============ 遮罩 ============ */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.68);
  backdrop-filter:blur(6px); display:flex; align-items:center;
  justify-content:center; z-index:300; animation:fadeIn .25s;
}
@keyframes fadeIn{ from{opacity:0} }
.panel{
  background:linear-gradient(160deg,#1e2a24,#0d1a13);
  border:2px solid rgba(255,216,77,.35);
  border-radius:20px; padding:30px 34px; text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  animation:pop .3s cubic-bezier(.2,1.4,.5,1);
  max-width:88vw;
}
@keyframes pop{ from{ transform:scale(.85); opacity:0; } }
.panel-title{ font-size:20px; font-weight:800; margin-bottom:20px; }
.color-options{ display:flex; gap:14px; justify-content:center; }
.color-options button{
  width:58px; height:58px; border-radius:16px;
  border:3px solid rgba(255,255,255,.85);
  background:var(--c); cursor:pointer; transition:.18s;
  box-shadow:0 6px 16px rgba(0,0,0,.5);
}
.color-options button:hover{ transform:translateY(-4px) scale(1.08); }
.color-options button:active{ transform:scale(.95); }
#gameOver .panel-title{ font-size:26px; }
#gameOver .sub{ font-size:13px; opacity:.7; margin-bottom:22px; }
.panel-actions{ display:flex; flex-direction:column; gap:10px; }

/* ============ 连接状态 ============ */
#connBadge{
  position:fixed; top:12px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.8); color:#ff9a9a;
  font-size:11px; font-weight:800; padding:6px 16px;
  border-radius:14px; z-index:500; letter-spacing:1px;
  transition:.3s;
}
#connBadge.ok{ opacity:0; pointer-events:none; }

/* ============ 响应式 ============ */
@media (max-width:520px){
  :root{ --card-w:56px; --card-h:84px; }
  #table{ gap:32px; }
  #handArea{ height:154px; }
  #hand .card + .card{ margin-left:-18px; }
  .opponent{ min-width:82px; padding:6px 8px; }
  .brand{ font-size:18px; }
  #status{ font-size:11px; }
  #roomBadge{ font-size:9px; padding:3px 7px; }
  .home-card{ padding:28px 22px 22px; }
  .brand-big{ font-size:44px; }
}
</style>
</head>
<body>

<div id="connBadge">连接中…</div>

<div id="app">

  <!-- ============ 首页 ============ -->
  <div id="screenHome" class="screen">
    <div class="home-card">
      <div class="brand-big">UNO</div>
      <div class="home-sub">联机对战</div>
      <input id="nameInput" maxlength="8" placeholder="输入你的昵称" autocomplete="off">
      <div class="home-row">
        <button id="createBtn" class="btn-primary">创建房间</button>
      </div>
      <div class="home-divider"><span>或加入好友房间</span></div>
      <div class="home-row">
        <input id="roomInput" maxlength="6" placeholder="房间码" autocomplete="off">
        <button id="joinBtn" class="btn-secondary">加入</button>
      </div>
      <div class="home-tip" id="homeTip"></div>
    </div>
  </div>

  <!-- ============ 大厅 ============ -->
  <div id="screenLobby" class="screen hidden">
    <div class="lobby-card">
      <div class="lobby-title">房间码 <span id="lobbyRoom">------</span></div>
      <div class="lobby-hint" id="lobbyHint">等待玩家加入…（2-4人）</div>
      <div id="lobbyList" class="lobby-list"></div>
      <div class="lobby-actions">
        <button id="addBotBtn" class="btn-ghost hidden">+ 添加电脑玩家</button>
        <button id="startBtn" class="btn-primary hidden">开始游戏</button>
        <button id="leaveBtn" class="btn-ghost">离开房间</button>
      </div>
    </div>
  </div>

  <!-- ============ 游戏 ============ -->
  <div id="screenGame" class="screen hidden">
    <div id="topbar">
      <div class="brand">UNO</div>
      <div id="roomBadge">房间 ------</div>
      <div id="status">准备中</div>
      <button id="passBtn" class="hidden">过 牌</button>
    </div>

    <div id="opponents"></div>

    <div id="table">
      <div class="pile-slot">
        <div id="drawPile" class="pile"></div>
        <div class="pile-label">牌堆 · <span id="deckCount">0</span></div>
      </div>
      <div class="pile-slot">
        <div id="discardPile" class="pile"></div>
        <div class="pile-label">当前颜色 <span id="colorDot" class="dot"></span></div>
      </div>
    </div>

    <div id="handArea">
      <div id="hand"></div>
    </div>
  </div>

</div>

<!-- ============ 颜色选择 ============ -->
<div id="colorPicker" class="overlay hidden">
  <div class="panel">
    <div class="panel-title">选择一个颜色</div>
    <div class="color-options">
      <button data-color="red"    style="--c:var(--red)"></button>
      <button data-color="yellow" style="--c:var(--yellow)"></button>
      <button data-color="green"  style="--c:var(--green)"></button>
      <button data-color="blue"   style="--c:var(--blue)"></button>
    </div>
  </div>
</div>

<!-- ============ 结算 ============ -->
<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <div class="panel-title" id="goTitle">游戏结束</div>
    <div class="sub" id="goSub"></div>
    <div class="panel-actions">
      <button id="againBtn" class="btn-primary hidden">再来一局</button>
      <button id="backHomeBtn" class="btn-ghost">返回首页</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
/* ==================================================================
 *  UNO 联机版（MQTT）
 *  架构：房主（Host）为权威服务器，其余客户端发送动作请求。
 *  通信：uno/v2/<room>/state   公共状态（房主广播）
 *        uno/v2/<room>/action  动作请求（客户端 → 房主）
 *        uno/v2/<room>/h/<pid> 私有手牌（房主 → 单个玩家）
 * ================================================================== */

/* ==================== 常量 ==================== */
const COLORS = ['red', 'yellow', 'green', 'blue'];
const COLOR_NAME = { red:'红', yellow:'黄', green:'绿', blue:'蓝' };
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const PREFIX = 'uno/v2/';
const BOT_NAMES = ['小蓝', '小绿', '小黄'];

/* ==================== 全局状态 ==================== */
const G = {
  pid: 'p' + Math.random().toString(36).slice(2, 9),
  name: '',
  room: '',
  isHost: false,
  pub: null,          // 公共状态快照
  myHand: [],         // 自己的手牌
  joined: false,
  screen: 'home',
};

/* 房主专用状态 */
const Host = {
  active: false,
  players: [],        // [{ pid, name, hand:[], isBot }]
  deck: [],
  discard: [],
  currentIdx: 0,
  dir: 1,
  currentColor: null,
  started: false,
  winner: null,
  drawnBy: null,
  lobbyPlayers: [],
};

/* ==================== 工具函数 ==================== */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const $ = id => document.getElementById(id);

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

function randomRoom() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

/* ==================== MQTT 网络层 ==================== */
let mqttClient = null;
const subs = new Map();   // topic -> [handler]

function setConnBadge(ok) {
  const el = $('connBadge');
  if (ok) {
    el.classList.add('ok');
  } else {
    el.classList.remove('ok');
    el.textContent = '连接中…';
  }
}

function mqttConnect() {
  return new Promise((resolve, reject) => {
    if (mqttClient && mqttClient.connected) return resolve();
    if (typeof mqtt === 'undefined') {
      $('connBadge').textContent = 'MQTT 库加载失败，请检查网络';
      return reject(new Error('mqtt lib missing'));
    }
    const cid = 'uno_' + Math.random().toString(16).slice(2, 10);
    mqttClient = mqtt.connect(BROKER, {
      clientId: cid,
      clean: true,
      reconnectPeriod: 4000,
      connectTimeout: 12000,
      keepalive: 30,
    });

    let settled = false;
    mqttClient.on('connect', () => {
      setConnBadge(true);
      // 重连后恢复订阅
      subs.forEach((_, topic) => mqttClient.subscribe(topic, { qos: 0 }));
      if (!settled) { settled = true; resolve(); }
    });
    mqttClient.on('reconnect', () => setConnBadge(false));
    mqttClient.on('close', () => setConnBadge(false));
    mqttClient.on('error', e => {
      console.warn('[MQTT]', e && e.message);
      if (!settled) { settled = true; reject(e); }
    });
    mqttClient.on('message', (topic, payload) => {
      const fns = subs.get(topic);
      if (!fns || !fns.length) return;
      let data;
      try { data = JSON.parse(payload.toString()); } catch { return; }
      fns.forEach(fn => { try { fn(data); } catch (err) { console.warn(err); } });
    });
  });
}

function mqttSub(topic, fn) {
  if (!subs.has(topic)) {
    subs.set(topic, []);
    if (mqttClient && mqttClient.connected) mqttClient.subscribe(topic, { qos: 0 });
  }
  const arr = subs.get(topic);
  if (!arr.includes(fn)) arr.push(fn);
}

function mqttPub(topic, obj) {
  if (!mqttClient || !mqttClient.connected) return false;
  try {
    mqttClient.publish(topic, JSON.stringify(obj), { qos: 0 });
    return true;
  } catch (e) { return false; }
}

/* ==================== 牌堆构建 ==================== */
let cardIdSeq = 0;
function buildDeck() {
  const d = [];
  for (const c of COLORS) {
    d.push({ color: c, value: '0', id: 'c' + (cardIdSeq++) });
    for (let n = 1; n <= 9; n++) {
      d.push({ color: c, value: String(n), id: 'c' + (cardIdSeq++) });
      d.push({ color: c, value: String(n), id: 'c' + (cardIdSeq++) });
    }
    for (const v of ['skip', 'reverse', 'draw2']) {
      d.push({ color: c, value: v, id: 'c' + (cardIdSeq++) });
      d.push({ color: c, value: v, id: 'c' + (cardIdSeq++) });
    }
  }
  for (let i = 0; i < 4; i++) {
    d.push({ color: 'wild', value: 'wild',  id: 'c' + (cardIdSeq++) });
    d.push({ color: 'wild', value: 'wild4', id: 'c' + (cardIdSeq++) });
  }
  return d;
}

/* ==================== 卡牌显示 ==================== */
function cardLabel(card) {
  switch (card.value) {
    case 'skip':    return '⊘';
    case 'reverse': return '⇄';
    case 'draw2':   return '+2';
    case 'wild':    return '';
    case 'wild4':   return '+4';
    default:        return card.value;
  }
}
function cardDesc(card) {
  const names = { skip:'禁止', reverse:'反转', draw2:'+2', wild:'变色', wild4:'+4变色' };
  if (card.color === 'wild') return names[card.value];
  return COLOR_NAME[card.color] + (names[card.value] || card.value);
}
function createCardEl(card) {
  const el = document.createElement('div');
  el.className = 'card';
  const face = document.createElement('div');
  face.className = 'face ' + card.color;
  if (card.color !== 'wild') {
    const oval = document.createElement('div');
    oval.className = 'oval';
    face.appendChild(oval);
  }
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = cardLabel(card);
  face.appendChild(label);
  el.appendChild(face);
  return el;
}
function createBackEl() {
  const el = document.createElement('div');
  el.className = 'card back';
  el.innerHTML = '<div class="face"><div class="oval"></div><span class="label">UNO</span></div>';
  return el;
}

function renderLobby() {

}

/* ==================== 公共状态消息处理（客户端） ==================== */
function onStateMessage(msg) {
  if (!msg || !msg.type) return;

  if (msg.type === 'lobby') {
    Host.lobbyPlayers = msg.players || [];
    G.joined = true;
    if (G.screen !== 'lobby' && G.screen !== 'game') enterLobby();
    renderLobby();
    return;
  }

  if (msg.type === 'state') {
    G.joined = true;
    const wasStarted = G.pub && G.pub.started;
    G.pub = msg;

    if (msg.toast) { /* 可选内联 toast */ }

    if (msg.started) {
      if (G.screen !== 'game') {
        switchScreen('game');
        $('roomBadge').textContent = '房间 ' + G.room;
      }
      renderGame();
      if (msg.winner) showGameOver(msg);
    } else {
      if (G.screen === 'game') switchScreen('lobby');
      renderLobby();
    }
    return;
  }

  if (msg.type === 'toast') { toast(msg.msg); return; }
}

/* ==================== 房主：广播 ==================== */
function hostBroadcastLobby() {
  if (!G.isHost || !G.room) return;
  const players = Host.players.map((p, i) => ({
    pid: p.pid, name: p.name, isBot: !!p.isBot, host: i === 0,
  }));
  mqttPub(PREFIX + G.room + '/state', { type: 'lobby', players });
  renderLobby();
}

function hostBroadcast() {
  if (!G.isHost || !G.room) return;
  const top = Host.discard[Host.discard.length - 1] || null;
  const players = Host.players.map(p => ({
    pid: p.pid,
    name: p.name,
    isBot: !!p.isBot,
    count: p.hand.length,
  }));
  const pub = {
    type: 'state',
    started: Host.started,
    players,
    currentPid: (Host.started && !Host.winner)
      ? Host.players[Host.currentIdx].pid : null,
    dir: Host.dir,
    topCard: top,
    currentColor: Host.currentColor,
    deckCount: Host.deck.length,
    drawnPid: Host.drawnBy,
    winner: Host.winner,
  };

  mqttPub(PREFIX + G.room + '/state', pub);

  // 私有手牌
  for (const p of Host.players) {
    if (p.isBot) continue;
    if (p.pid === G.pid) continue;  // 自己本地更新
    mqttPub(PREFIX + G.room + '/h/' + p.pid, { type: 'hand', cards: p.hand });
  }

  // 本地应用
  const me = Host.players.find(p => p.pid === G.pid);
  if (me) G.myHand = me.hand;
  G.pub = pub;

  if (Host.started) {
    if (G.screen !== 'game') {
      switchScreen('game');
      $('roomBadge').textContent = '房间 ' + G.room;
    }
    renderGame();
    if (Host.winner) showGameOver(pub);
  }
}

function hostEvent(msg) {
  if (!G.isHost || !G.room) return;
  mqttPub(PREFIX + G.room + '/state', { type: 'toast', msg });
  toast(msg);
}

/* ==================== 房主：游戏流程 ==================== */
function wrapIdx(i) {
  const n = Host.players.length;
  return ((i % n) + n) % n;
}

function hostStartGame() {
  Host.deck = shuffle(buildDeck());
  Host.discard = [];
  Host.dir = 1;
  Host.currentIdx = 0;
  Host.winner = null;
  Host.drawnBy = null;

  for (const p of Host.players) p.hand = [];

  // 发牌
  for (let r = 0; r < 7; r++) {
    for (const p of Host.players) p.hand.push(Host.deck.pop());
  }

  // 首张牌：必须是数字牌
  let guard = 0;
  while (guard++ < 400 && Host.deck.length) {
    const c = Host.deck.pop();
    if (['wild', 'wild4', 'skip', 'reverse', 'draw2'].includes(c.value)) {
      Host.deck.unshift(c);
      continue;
    }
    Host.discard.push(c);
    Host.currentColor = c.color;
    break;
  }

  Host.started = true;
  hostBroadcast();
  hostEvent('游戏开始！');
  hostMaybeBot();
}

function hostIsPlayable(card) {
  if (!Host.started || Host.winner) return false;
  if (card.color === 'wild') return true;
  if (card.color === Host.currentColor) return true;
  const top = Host.discard[Host.discard.length - 1];
  if (top && top.color !== 'wild' && card.value === top.value) return true;
  return false;
}

function hostDrawTo(player, n) {
  for (let i = 0; i < n; i++) {
    if (Host.deck.length === 0) {
      if (Host.discard.length <= 1) break;
      const top = Host.discard.pop();
      Host.deck = shuffle(Host.discard);
      Host.discard = [top];
    }
    if (Host.deck.length === 0) break;
    player.hand.push(Host.deck.pop());
  }
}

function hostAdvance(skip = 0) {
  if (!Host.started || Host.winner) return;
  Host.currentIdx = wrapIdx(Host.currentIdx + Host.dir * (1 + skip));
  Host.drawnBy = null;
  hostBroadcast();
  hostMaybeBot();
}

function hostHandlePlay(pid, cardId, color) {
  if (!Host.started || Host.winner) return;
  const cur = Host.players[Host.currentIdx];
  if (!cur || cur.pid !== pid) return;

  const idx = cur.hand.findIndex(c => c.id === cardId);
  if (idx < 0) return;
  const card = cur.hand[idx];
  if (!hostIsPlayable(card)) return;

  cur.hand.splice(idx, 1);
  Host.discard.push(card);
  Host.currentColor = card.color === 'wild'
    ? (COLORS.includes(color) ? color : 'red')
    : card.color;
  Host.drawnBy = null;

  // 胜利判定
  if (cur.hand.length === 0) {
    Host.winner = cur.pid;
    hostBroadcast();
    hostEvent(`${cur.name} 获胜！`);
    return;
  }
  if (cur.hand.length === 1) hostEvent(`${cur.name}：UNO！`);

  let skip = 0;
  if (card.value === 'skip') {
    skip = 1;
  } else if (card.value === 'reverse') {
    Host.dir *= -1;
    if (Host.players.length === 2) skip = 1;
  } else if (card.value === 'draw2' || card.value === 'wild4') {
    const n = card.value === 'draw2' ? 2 : 4;
    const victim = Host.players[wrapIdx(Host.currentIdx + Host.dir)];
    hostDrawTo(victim, n);
    skip = 1;
    hostEvent(`${victim.name} 摸 ${n} 张牌并跳过`);
  }

  hostBroadcast();
  setTimeout(() => hostAdvance(skip), 380);
}

function hostHandleDraw(pid) {
  if (!Host.started || Host.winner) return;
  const cur = Host.players[Host.currentIdx];
  if (!cur || cur.pid !== pid) return;
  if (Host.drawnBy === pid) return;   // 本回合已摸过

  hostDrawTo(cur, 1);
  Host.drawnBy = pid;
  hostBroadcast();

  const drawn = cur.hand[cur.hand.length - 1];
  if (drawn && !hostIsPlayable(drawn)) {
    hostEvent(`${cur.name} 摸牌后无法出牌，自动跳过`);
    setTimeout(() => {
      if (!Host.winner && Host.drawnBy === pid) hostAdvance(0);
    }, 800);
  }
}

function hostHandlePass(pid) {
  if (!Host.started || Host.winner) return;
  const cur = Host.players[Host.currentIdx];
  if (!cur || cur.pid !== pid) return;
  if (Host.drawnBy !== pid) return;
  hostAdvance(0);
}

/* ==================== 房主：AI ==================== */
function hostScoreCard(c) {
  if (c.color === 'wild') return c.value === 'wild4' ? 6 : 10;
  switch (c.value) {
    case 'draw2':   return 100;
    case 'skip':    return 96;
    case 'reverse': return 92;
    default:        return 50 + (parseInt(c.value, 10) || 0);
  }
}

function hostBestColor(player) {
  const cnt = { red:0, yellow:0, green:0, blue:0 };
  for (const c of player.hand) if (c.color !== 'wild') cnt[c.color]++;
  let best = 'red', max = -1;
  for (const c of COLORS) if (cnt[c] > max) { max = cnt[c]; best = c; }
  return best;
}

function hostMaybeBot() {
  if (!Host.started || Host.winner) return;
  const cur = Host.players[Host.currentIdx];
  if (!cur || !cur.isBot) return;
  setTimeout(() => {
    if (!Host.started || Host.winner) return;
    if (Host.players[Host.currentIdx] !== cur) return;
    hostBotTurn();
  }, 850);
}

function hostBotTurn() {
  const cur = Host.players[Host.currentIdx];
  if (!cur || !cur.isBot) return;

  const playable = cur.hand.filter(hostIsPlayable);

  if (playable.length === 0) {
    hostDrawTo(cur, 1);
    hostBroadcast();
    const drawn = cur.hand[cur.hand.length - 1];
    setTimeout(() => {
      if (!Host.started || Host.winner) return;
      if (Host.players[Host.currentIdx] !== cur) return;
      if (drawn && hostIsPlayable(drawn)) {
        hostHandlePlay(cur.pid, drawn.id, drawn.color === 'wild' ? hostBestColor(cur) : null);
      } else {
        hostEvent(`${cur.name} 摸牌后跳过`);
        hostAdvance(0);
      }
    }, 650);
    return;
  }

  const pick = playable.slice().sort((a, b) => hostScoreCard(b) - hostScoreCard(a))[0];
  setTimeout(() => {
    if (!Host.started || Host.winner) return;
    if (Host.players[Host.currentIdx] !== cur) return;
    hostHandlePlay(cur.pid, pick.id, pick.color === 'wild' ? hostBestColor(cur) : null);
  }, 420);
}

/* ==================== 房主：动作分发 ==================== */
function hostOnAction(msg) {
  if (!msg || !msg.type) return;

  switch (msg.type) {
    case 'join': {
      if (!G.isHost) return;
      if (Host.started) {
        // 游戏中不允许加入
        mqttPub(PREFIX + G.room + '/h/' + msg.pid, { type: 'hand', cards: [] });
        return;
      }
      if (Host.players.length >= 4) {
        hostEvent('房间已满（最多 4 人）');
        return;
      }
      if (Host.players.some(p => p.pid === msg.pid)) return;

      Host.players.push({
        pid: msg.pid,
        name: String(msg.name || '玩家').slice(0, 8),
        hand: [],
        isBot: false,
      });
      hostBroadcastLobby();
      hostEvent(`${msg.name} 加入了房间`);
      break;
    }

    case 'leave': {
      if (!G.isHost) return;
      const i = Host.players.findIndex(p => p.pid === msg.pid);
      if (i < 0) return;
      if (Host.started && !Host.winner) {
        // 游戏中离开：标记为托管（简单处理为跳过）
        hostEvent(`${Host.players[i].name} 离开了游戏`);
        // 用机器人接管
        Host.players[i].isBot = true;
        Host.players[i].name += '(托管)';
        hostBroadcast();
        hostMaybeBot();
        return;
      }
      const name = Host.players[i].name;
      Host.players.splice(i, 1);
      if (Host.players.length === 0) { Host.active = false; return; }
      if (Host.currentIdx >= Host.players.length) Host.currentIdx = 0;
      hostBroadcastLobby();
      hostEvent(`${name} 离开了房间`);
      break;
    }

    case 'start': {
      if (!G.isHost || msg.pid !== G.pid) return;
      hostStartGame();
      break;
    }

    case 'play': {
      if (!G.isHost) return;
      hostHandlePlay(msg.pid, msg.cardId, msg.color);
      break;
    }

    case 'draw': {
      if (!G.isHost) return;
      hostHandleDraw(msg.pid);
      break;
    }

    case 'pass': {
      if (!G.isHost) return;
      hostHandlePass(msg.pid);
      break;
    }

    case 'restart': {
      if (!G.isHost || msg.pid !== G.pid) return;
      if (Host.players.length < 2) { toast('人数不足'); return; }
      hostStartGame();
      break;
    }
  }
}

/* ==================== 发送动作（统一切口） ==================== */
function sendAction(obj) {
  if (!G.room) return;
  if (G.isHost) {
    hostOnAction(obj);
  } else {
    mqttPub(PREFIX + G.room + '/action', obj);
  }
}

/* ==================== 游戏界面渲染 ==================== */
function renderGame() {
  if (!G.pub || !G.pub.started) return;
  renderOpponents();
  renderTable();
  renderHand();
  renderStatus();
}

function orderPlayers() {
  const pub = G.pub;
  if (!pub || !pub.players) return [];
  const meIdx = pub.players.findIndex(p => p.pid === G.pid);
  if (meIdx < 0) return pub.players.slice();
  const arr = [];
  for (let i = 1; i < pub.players.length; i++) {
    arr.push(pub.players[(meIdx + i) % pub.players.length]);
  }
  return arr;
}

function renderOpponents() {
  const wrapEl = $('opponents');
  wrapEl.innerHTML = '';
  const list = orderPlayers();
  const pub = G.pub;

  list.forEach(p => {
    const div = document.createElement('div');
    const isActive = pub.currentPid === p.pid && !pub.winner;
    div.className = 'opponent' + (isActive ? ' active' : '');
    div.innerHTML = `
      <div class="opp-name">${escapeHtml(p.name)}</div>
      <div class="opp-cards"></div>
      <div class="opp-count ${p.count === 1 ? 'uno' : ''}">
        ${p.count === 1 ? 'UNO!' : p.count + ' 张'}
      </div>`;
    const cardsEl = div.querySelector('.opp-cards');
    const show = Math.min(p.count, 9);
    for (let j = 0; j < show; j++) {
      const m = document.createElement('div');
      m.className = 'mini-back';
      cardsEl.appendChild(m);
    }
    wrapEl.appendChild(div);
  });
}

function renderTable() {
  const drawPile = $('drawPile');
  drawPile.innerHTML = '';
  const n = Math.min(G.pub.deckCount || 0, 3);
  for (let i = 0; i < n; i++) {
    const b = createBackEl();
    const off = (n - 1 - i) * 3;
    b.style.transform = `translate(${off}px, ${-off}px)`;
    drawPile.appendChild(b);
  }
  $('deckCount').textContent = G.pub.deckCount || 0;

  const discardPile = $('discardPile');
  discardPile.innerHTML = '';
  if (G.pub.topCard) discardPile.appendChild(createCardEl(G.pub.topCard));

  const dot = $('colorDot');
  if (G.pub.currentColor) {
    dot.style.background = `var(--${G.pub.currentColor})`;
    dot.style.boxShadow = `0 0 10px var(--${G.pub.currentColor})`;
  }
}

function clientCanPlay(card) {
  const pub = G.pub;
  if (!pub || !pub.started || pub.winner) return false;
  if (pub.currentPid !== G.pid) return false;
  if (card.color === 'wild') return true;
  if (card.color === pub.currentColor) return true;
  const top = pub.topCard;
  if (top && top.color !== 'wild' && card.value === top.value) return true;
  return false;
}

function renderHand() {
  const el = $('hand');
  el.innerHTML = '';
  const hand = G.myHand || [];
  hand.forEach(card => {
    const c = createCardEl(card);
    if (clientCanPlay(card)) c.classList.add('playable');
    c.addEventListener('click', () => onCardClick(card));
    el.appendChild(c);
  });
}

function renderStatus() {
  const st = $('status');
  const passBtn = $('passBtn');
  const pub = G.pub;
  if (!pub) return;

  if (pub.winner) {
    st.textContent = '游戏结束';
    passBtn.classList.add('hidden');
    return;
  }

  if (pub.currentPid === G.pid) {
    st.textContent = pub.drawnPid === G.pid ? '出牌或过牌' : '轮到你出牌';
  } else {
    const cur = pub.players.find(p => p.pid === pub.currentPid);
    st.textContent = cur ? `${cur.name} 思考中…` : '';
  }

  const showPass = pub.currentPid === G.pid && pub.drawnPid === G.pid && !pub.winner;
  passBtn.classList.toggle('hidden', !showPass);
}

/* ==================== 玩家操作 ==================== */
function onCardClick(card) {
  const pub = G.pub;
  if (!pub || !pub.started || pub.winner) return;
  if (pub.currentPid !== G.pid) { toast('还没轮到你'); return; }
  if (!clientCanPlay(card)) { toast('这张牌不能出'); return; }

  if (card.color === 'wild') {
    showColorPicker(color => {
      sendAction({ type: 'play', pid: G.pid, cardId: card.id, color });
    });
  } else {
    sendAction({ type: 'play', pid: G.pid, cardId: card.id, color: null });
  }
}

$('drawPile').addEventListener('click', () => {
  const pub = G.pub;
  if (!pub || !pub.started || pub.winner) return;
  if (pub.currentPid !== G.pid) { toast('还没轮到你'); return; }
  if (pub.drawnPid === G.pid) { toast('本回合已经摸过牌了'); return; }
  sendAction({ type: 'draw', pid: G.pid });
});

$('passBtn').addEventListener('click', () => {
  const pub = G.pub;
  if (!pub || pub.currentPid !== G.pid) return;
  if (pub.drawnPid !== G.pid) return;
  sendAction({ type: 'pass', pid: G.pid });
});

/* ==================== 颜色选择器 ==================== */
function showColorPicker(cb) {
  const el = $('colorPicker');
  el.classList.remove('hidden');
  const handler = e => {
    const btn = e.target.closest('[data-color]');
    if (!btn) return;
    el.classList.add('hidden');
    el.removeEventListener('click', handler);
    cb(btn.dataset.color);
  };
  el.addEventListener('click', handler);
}

/* ==================== 结算 ==================== */
function showGameOver(pub) {
  const el = $('gameOver');
  el.classList.remove('hidden');
  const winner = pub.players.find(p => p.pid === pub.winner);
  const iWin = pub.winner === G.pid;
  $('goTitle').textContent = iWin ? '🎉 你赢了！' : `${winner ? winner.name : '???'} 获胜`;
  $('goSub').textContent = iWin ? '恭喜你打完了所有手牌' : '再接再厉，下一局翻盘！';
  $('againBtn').classList.toggle('hidden', !G.isHost);
}

$('againBtn').addEventListener('click', () => {
  if (!G.isHost) return;
  $('gameOver').classList.add('hidden');
  sendAction({ type: 'restart', pid: G.pid });
});

/* ==================== 离开页面 ==================== */
window.addEventListener('beforeunload', () => {
  if (G.room && !G.isHost && G.joined) {
    mqttPub(PREFIX + G.room + '/action', { type: 'leave', pid: G.pid });
  }
});

/* ==================== 启动 ==================== */
(function boot() {
  // 预填昵称
  $('nameInput').value = '玩家' + G.pid.slice(1, 4).toUpperCase();
  // 预连接（提升体验，失败静默）
  mqttConnect().catch(() => {});
  switchScreen('home');
})();
</script>
</body>
</html>
